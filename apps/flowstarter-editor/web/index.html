<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf7ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#040308" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#040308" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (() => {
        /* Match `--fs-bg-base` in index.css so first paint + html canvas align with FlowBackground. */
        const LIGHT_BACKGROUND = "#fbf7ef";
        const DARK_BACKGROUND = "#040308";
        const themeColorMeta = document.querySelector('meta[name="theme-color"]');
        /* Theme resolution for first paint (before useTheme.ts loads):
             - explicit "dark"   → dark
             - explicit "light"  → light
             - "system" / unset  → match OS prefers-color-scheme
           Mirrors getStored() in useTheme.ts: shared cookie first (same
           `flowstarter_theme` cookie flowstarter-main writes, so a
           preference set there shows up here on next load), then the
           shared localStorage key, then the editor's pre-migration key,
           so the boot shell and the hydrated React app agree on the very
           first paint. */
        let stored = null;
        try {
          const cookieMatch = document.cookie
            .split(";")
            .map(function (entry) { return entry.trim(); })
            .find(function (entry) { return entry.indexOf("flowstarter_theme=") === 0; });
          stored = cookieMatch ? decodeURIComponent(cookieMatch.split("=")[1]) : null;
          if (!stored) {
            stored =
              window.localStorage.getItem("flowstarter_theme") ||
              window.localStorage.getItem("flowstarter-editor:theme");
          }
        } catch {}
        const systemDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        const isDark =
          stored === "dark" || (stored !== "light" && systemDark);
        document.documentElement.classList.toggle("dark", isDark);
        const chromeColor = isDark ? DARK_BACKGROUND : LIGHT_BACKGROUND;
        document.documentElement.style.backgroundColor = chromeColor;
        themeColorMeta?.setAttribute("content", chromeColor);
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #fbf7ef;
        color: #120a22;
        font-family:
          "Onest",
          "Plus Jakarta Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }
      html.dark body {
        background: #040308;
        color: #f4eee4;
      }

      /* Boot shell — visually identical to the React EditorBootstrapLoader
         loader so the HTML→React handoff is seamless. Aura behind +
         compact card + brand-indigo F mark + animated progress bar.
         The card is width-capped to 540px so it lines up with the
         sign-in / AuthFormCard width. */
      #boot-shell {
        position: relative;
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: inherit;
        padding: 40px 24px;
      }
      #boot-shell::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            900px 600px at 12% -10%,
            rgba(78, 94, 218, 0.18),
            transparent 60%
          ),
          radial-gradient(
            720px 520px at 100% 8%,
            rgba(180, 83, 9, 0.1),
            transparent 65%
          ),
          radial-gradient(
            800px 600px at 50% 110%,
            rgba(78, 94, 218, 0.12),
            transparent 70%
          );
        pointer-events: none;
      }
      html.dark #boot-shell::before {
        background:
          radial-gradient(
            900px 600px at 12% -10%,
            rgba(88, 106, 240, 0.42),
            transparent 60%
          ),
          radial-gradient(
            720px 520px at 100% 8%,
            rgba(255, 160, 80, 0.2),
            transparent 65%
          ),
          radial-gradient(
            800px 600px at 50% 110%,
            rgba(88, 106, 240, 0.32),
            transparent 70%
          );
      }

      #boot-shell-card {
        position: relative;
        z-index: 1;
        display: flex;
        width: 100%;
        max-width: 540px;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        padding: 44px 40px;
        border-radius: 18px;
        background: #ffffff;
        border: 1px solid rgba(18, 10, 34, 0.18);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.92),
          inset 0 -1px 0 rgba(18, 10, 34, 0.04),
          0 24px 60px rgba(78, 94, 218, 0.1),
          0 8px 22px rgba(18, 10, 34, 0.06);
      }
      html.dark #boot-shell-card {
        background: #0a0714;
        border-color: rgba(244, 238, 228, 0.2);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.06),
          inset 0 -1px 0 rgba(0, 0, 0, 0.34),
          0 20px 50px rgba(2, 6, 23, 0.38),
          0 8px 24px rgba(56, 97, 182, 0.14);
      }

      #boot-shell-logo {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: linear-gradient(
          135deg,
          hsl(233, 65%, 50%) 0%,
          hsl(233, 75%, 60%) 50%,
          hsl(180, 65%, 55%) 100%
        );
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        font-size: 24px;
        font-family: "Onest", "Plus Jakarta Sans", system-ui, sans-serif;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.32) inset,
          0 6px 20px rgba(78, 94, 218, 0.35);
      }

      #boot-shell-copy {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        text-align: center;
      }
      #boot-shell-overline {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        opacity: 0.5;
      }
      #boot-shell-name {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      #boot-shell-name em {
        font-style: normal;
        color: hsl(233, 68%, 46%);
      }
      html.dark #boot-shell-name em {
        color: hsl(233, 76%, 72%);
      }

      #boot-shell-bar {
        position: relative;
        width: 128px;
        height: 2px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(18, 10, 34, 0.1);
      }
      html.dark #boot-shell-bar {
        background: rgba(244, 238, 228, 0.12);
      }
      #boot-shell-bar::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 38%;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          transparent,
          hsl(233, 65%, 50%),
          transparent
        );
        animation: boot-bar 1.4s ease-in-out infinite;
      }
      @keyframes boot-bar {
        0% {
          transform: translateX(-220%);
        }
        100% {
          transform: translateX(420%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-shell-bar::after {
          animation: none;
          width: 100%;
          opacity: 0.4;
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@300..800&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=JetBrains+Mono:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <meta name="application-name" content="Flowstarter Assistant" />
    <meta property="og:title" content="Flowstarter Assistant" />
    <meta name="twitter:title" content="Flowstarter Assistant" />
    <meta name="apple-mobile-web-app-title" content="Flowstarter Assistant" />
    <title>Flowstarter Assistant</title>
  </head>
  <body>
    <!-- React portals FlowstarterFlowBg here so mesh sits under #root (whole shell, not inset-only). -->
    <div id="fs-flow-bg-mount"></div>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="Flowstarter Assistant loading">
          <div id="boot-shell-logo">F</div>
          <div id="boot-shell-copy">
            <span id="boot-shell-overline">Flowstarter Assistant</span>
            <span id="boot-shell-name">Opening your <em>workspace</em></span>
          </div>
          <div id="boot-shell-bar" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
