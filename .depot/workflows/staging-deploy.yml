##############################################################################
# staging-deploy.yml
#
# Push to main → build the Next image → SSH to Hetzner → deploy slot `main`
# at https://staging.flowstarter.dev
#
# The staging database is the Supabase CLI stack running ON THE HETZNER HOST
# itself, bound to 127.0.0.1:54321/:54322 (see deploy/hetzner-staging/README.md,
# "Database"). This lane never reads the production NEXT_PUBLIC_SUPABASE_URL /
# NEXT_PUBLIC_SUPABASE_ANON_KEY secrets and never falls back to them: the build
# args come only from vars.STAGING_SUPABASE_URL / secrets.STAGING_SUPABASE_ANON_KEY,
# validated below to be a loopback/docker-internal host, never a hosted
# supabase.co project. Before the SSH deploy, the repo's supabase/ directory
# is synced to the host so deploy-slot.sh / supabase-stack.sh can apply
# migrations against it.
#
# Production is NOT updated here. That happens only from release.yml, which
# builds the release tag and deploys it to the Hetzner `prod` slot at
# https://flowstarter.net.
#
# Secrets (Depot):
#   STAGING_SSH_HOST, STAGING_SSH_USER, STAGING_SSH_KEY
#   STAGING_SUPABASE_ANON_KEY   Supabase CLI stack's demo anon key
# Vars:
#   STAGING_URL           default https://staging.flowstarter.dev
#   STAGING_SUPABASE_URL  default http://127.0.0.1:54321
##############################################################################

name: Staging deploy (main)
on:
  push:
    branches: [main, master]
  workflow_dispatch:
concurrency:
  group: staging-deploy-main
  cancel-in-progress: true
env:
  NODE_VERSION: '22'
permissions:
  contents: read
  packages: write
jobs:
  deploy:
    name: Build and deploy staging.flowstarter.dev
    runs-on: depot-ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check SSH secrets
        id: ssh
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          USER: ${{ secrets.STAGING_SSH_USER }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          if [ -n "${HOST:-}" ] && [ -n "${USER:-}" ] && [ -n "${KEY:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::STAGING_SSH_HOST / STAGING_SSH_USER / STAGING_SSH_KEY are not set; skipping Hetzner deploy. Image will still build and push to GHCR."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # Staging must never build against a hosted Supabase project. This
      # gate warns and skips the rest of the job (green, not red) when the
      # anon key is not configured yet, and fails hard, before anything is
      # built, if the URL is not the local stack.
      - name: Check staging Supabase config
        id: supabase
        env:
          STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          url="${STAGING_SUPABASE_URL:-http://127.0.0.1:54321}"
          if [ -z "${STAGING_SUPABASE_ANON_KEY:-}" ]; then
            echo "::warning::STAGING_SUPABASE_ANON_KEY is not set; skipping the rest of this job. See docs/ci/secrets.md."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$url" in
            *supabase.co*)
              echo "::error::STAGING_SUPABASE_URL ($url) points at a hosted supabase.co project. Staging must build against the local Supabase CLI stack on the Hetzner host, never production."
              exit 1
              ;;
          esac
          host="$(printf '%s' "$url" | sed -E 's#^[a-zA-Z]+://##; s#[/:].*$##')"
          case "$host" in
            127.0.0.1 | localhost | ::1 | host.docker.internal) ;;
            *)
              echo "::error::STAGING_SUPABASE_URL ($url) does not resolve to a loopback or docker-internal host (got '$host')."
              exit 1
              ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Lowercase image name
        if: steps.supabase.outputs.present == 'true'
        id: image
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/flowstarter-main" >> "$GITHUB_OUTPUT"
          echo "mcp=ghcr.io/${owner}/flowstarter-mcp" >> "$GITHUB_OUTPUT"
          echo "worker=ghcr.io/${owner}/flowstarter-build-worker" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.supabase.outputs.present == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # Must be the account that owns GHCR_TOKEN, not github.actor.
          username: ${{ vars.GHCR_USERNAME }}
          # Classic PAT with write:packages. Depot GITHUB_TOKEN cannot create
          # org packages (installation not allowed to Create organization package).
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.supabase.outputs.present == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: steps.supabase.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/hetzner-staging/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:main
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ steps.supabase.outputs.url }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.STAGING_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SITE_URL=https://staging.flowstarter.dev
            BUILD_LIBRARY_PREVIEWS=true
            FLOWSTARTER_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The template library (MCP server), as its own image. It takes no
      # NEXT_PUBLIC_* build args and holds no environment-specific value, so
      # the same image is correct for staging and for production and the two
      # lanes cannot cross-contaminate through it.
      #
      # BUILT FROM THE SAME github.sha AS THE APP, and that is not incidental.
      # The app image bakes the four templates' installed node_modules at
      # /srv/preview-templates and symlinks them into every generated
      # workspace; this image ships the same four templates' SOURCES, which is
      # what `scaffold_template` returns. A scaffold whose package.json
      # disagrees with the node_modules the app symlinks in is a preview that
      # dies at `astro build` on an import the template plainly declares. One
      # commit, both halves.
      #
      # Built unconditionally alongside the app, deployed below only when the
      # SSH secrets are present, exactly like the app's.
      - name: Build and push the template library image
        if: steps.supabase.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/flowstarter-library/mcp-server/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.mcp }}:${{ github.sha }}
            ${{ steps.image.outputs.mcp }}:main
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp

      # The build worker, as its own image. Separate from the app's on purpose:
      # it installs a different (much smaller) dependency graph, it carries a
      # Docker CLI the app must never have, and it takes no NEXT_PUBLIC_* build
      # args at all — nothing about it is inlined at build time, so the same
      # image is correct for staging and for production and the two lanes
      # cannot cross-contaminate through it the way they could through the
      # app's bundle.
      #
      # Built unconditionally alongside the app, deployed below only when the
      # SSH secrets are present, exactly like the app's.
      - name: Build and push the build worker image
        if: steps.supabase.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/build-worker/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.worker }}:${{ github.sha }}
            ${{ steps.image.outputs.worker }}:main
          cache-from: type=gha,scope=build-worker
          cache-to: type=gha,mode=max,scope=build-worker

      - name: Resolve staging URL
        if: steps.supabase.outputs.present == 'true' && steps.ssh.outputs.present == 'true'
        id: staging_url
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          echo "url=${STAGING_URL:-https://staging.flowstarter.dev}" >> "$GITHUB_OUTPUT"

      # deploy-slot.sh (main) applies migrations against this checkout of
      # supabase/, so the schema always matches the code being deployed.
      #
      # This must be authoritative, not additive: extracting on top of
      # whatever is already there (the old `tar -xf - --overwrite`) only ever
      # adds or replaces files, it never removes ones the repo no longer has.
      # A migration renamed on main (e.g. PR #140,
      # 20260913120000_assets_original_name.sql →
      # 20260913121000_assets_original_name.sql) left BOTH files on the box,
      # so `supabase migration up` saw two migrations sharing one version and
      # every deploy failed until someone deleted the stale copy by hand.
      #
      # The extract-to-temp-and-swap logic that fixed this lives in
      # sync-supabase.sh (deployed to the host alongside deploy-slot.sh and
      # supabase-stack.sh, see README.md, "One-time box setup"), not inline
      # here: the deploy user's sudoers entry
      # (/etc/sudoers.d/flowstarter-deploy on the host) grants NOPASSWD only
      # for exact commands, and a `Cmnd_Alias` for the slot scripts by path
      # (`/opt/flowstarter/staging/*.sh`). Shell logic embedded straight into
      # the ssh argument — the first version of this fix — is not a command
      # sudoers can name, so it failed outright ("sudo: a password is
      # required") the moment it shipped. Piping to one already-whitelisted
      # script is what sudoers can actually grant.
      #
      # 2026-09-15: the same tar stream also carries deploy/hetzner-staging/
      # scripts/ now, as a second top-level "scripts" entry, and
      # sync-supabase.sh installs any of those *.sh files that changed into
      # /opt/flowstarter/staging/ (still just that one whitelisted script
      # doing the writing; no sudoers change). Before this, nothing ever
      # updated deploy-slot.sh, supabase-stack.sh, etc. on the host past
      # their one-time bootstrap copy — main and the box silently drifted
      # apart, and the box was still running deploy-slot.sh from a
      # days-old commit (missing #175's image retention) when the staging
      # disk filled. See docs/operations/deploy-disk.md and
      # sync-supabase.sh's own header comment.
      #
      # Two more top-level entries, "mcp" and "build-worker", carry the
      # template library's and the build worker's compose files to
      # /opt/flowstarter/mcp/ and /opt/flowstarter/build-worker/ for the same
      # reason: both are files the box runs and `main` owns. Neither env file
      # is in this stream and never will be — the real ones are
      # /etc/flowstarter/mcp-staging.env and
      # /etc/flowstarter/build-worker-staging.env, mode 600, and a lane that
      # could write them could write a secret out of a git checkout.
      - name: Sync supabase/, scripts/ and the mcp/build-worker compose files to the host
        if: steps.supabase.outputs.present == 'true' && steps.ssh.outputs.present == 'true'
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          USER: ${{ secrets.STAGING_SSH_USER }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/staging_key"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/staging_key"
          SSH=(ssh -i "$RUNNER_TEMP/staging_key" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes)
          tar -C . -cf - supabase -C deploy/hetzner-staging scripts mcp build-worker \
            | "${SSH[@]}" "${USER}@${HOST}" "sudo /opt/flowstarter/staging/sync-supabase.sh"

      # Trust, then verify: sync-supabase.sh already logs each script it
      # installs, but a silent gap here (a script that fails to copy, a stale
      # sudo cache, a typo in a future edit to the tar command above) is
      # exactly the failure mode that let the box run a days-old
      # deploy-slot.sh in the first place. Comparing every script's sha256
      # between this checkout and the host, right after the sync step and
      # before deploy-slot.sh is invoked below, turns that kind of drift into
      # a loud, immediate CI failure instead of a disk that quietly fills up
      # again some days from now.
      - name: Verify installed scripts match the repo
        if: steps.supabase.outputs.present == 'true' && steps.ssh.outputs.present == 'true'
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          USER: ${{ secrets.STAGING_SSH_USER }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/staging_key"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/staging_key"
          SSH=(ssh -i "$RUNNER_TEMP/staging_key" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes)

          # Both sides hash the exact same file list, in the exact same
          # order: the glob is expanded once, locally, into a quoted name
          # list that is reused verbatim for the remote command.
          names="$(cd deploy/hetzner-staging/scripts && printf '%q ' *.sh)"
          expected="$(cd deploy/hetzner-staging/scripts && eval "sha256sum ${names}")"
          actual="$("${SSH[@]}" "${USER}@${HOST}" \
            "cd /opt/flowstarter/staging && sha256sum ${names}" 2>&1 || true)"

          if [ "$expected" != "$actual" ]; then
            echo "::error::Scripts installed on the host do not match deploy/hetzner-staging/scripts/ in this push. sync-supabase.sh should have installed them in the previous step; check its output there, and confirm /etc/sudoers.d/flowstarter-deploy on the host still grants FLOWSTARTER_SLOTS = /opt/flowstarter/staging/*.sh."
            echo "--- expected (this repo checkout) ---"
            echo "$expected"
            echo "--- actual (on the host) ---"
            echo "$actual"
            exit 1
          fi
          echo "All scripts on the host match this repo checkout byte-for-byte."

          # The template library's compose file, checked the same way and for
          # the same reason. It is not under scripts/, so the glob above cannot
          # cover it, and a compose file that silently stayed behind is exactly
          # the drift this whole step exists to catch: it is what decides the
          # loopback publish rule, the read-only root filesystem and the
          # resource caps.
          compose_expected="$(sha256sum deploy/hetzner-staging/mcp/docker-compose.yml | awk '{print $1}')"
          compose_actual="$("${SSH[@]}" "${USER}@${HOST}" \
            "sha256sum /opt/flowstarter/mcp/docker-compose.yml 2>/dev/null | awk '{print \$1}'" || true)"
          if [ "$compose_expected" != "$compose_actual" ]; then
            echo "::error::/opt/flowstarter/mcp/docker-compose.yml on the host does not match deploy/hetzner-staging/mcp/docker-compose.yml in this push (expected ${compose_expected}, host reported '${compose_actual}'). sync-supabase.sh should have installed it in the previous step; check its output there."
            exit 1
          fi
          echo "The template library compose file on the host matches this repo checkout byte-for-byte."

          # The build worker's compose file, checked the same way and for the
          # same reason. It is not under scripts/, so the glob above cannot
          # cover it, and a compose file that silently stayed behind is
          # exactly the drift this whole step exists to catch: it is what
          # decides the Docker socket mount, the worktrees bind path and the
          # resource caps.
          compose_expected="$(sha256sum deploy/hetzner-staging/build-worker/docker-compose.yml | awk '{print $1}')"
          compose_actual="$("${SSH[@]}" "${USER}@${HOST}" \
            "sha256sum /opt/flowstarter/build-worker/docker-compose.yml 2>/dev/null | awk '{print \$1}'" || true)"
          if [ "$compose_expected" != "$compose_actual" ]; then
            echo "::error::/opt/flowstarter/build-worker/docker-compose.yml on the host does not match deploy/hetzner-staging/build-worker/docker-compose.yml in this push (expected ${compose_expected}, host reported '${compose_actual}'). sync-supabase.sh should have installed it in the previous step; check its output there."
            exit 1
          fi
          echo "The build worker compose file on the host matches this repo checkout byte-for-byte."

      # The template library, BEFORE the app slot, and the order is the point.
      #
      # It is the opposite of the build worker's ordering next door, because
      # the dependency runs the other way: nothing in the library calls back
      # into flowstarter-main, while the app asks the library for a catalog
      # and a template's sources on every live-preview request. Two things
      # follow.
      #
      # First, a library deploy that fails must not leave a NEW app slot
      # pointing at an OLD library: deployed first, a failure here stops the
      # job with staging still running a matched pair (old app, old library)
      # rather than a mismatched one. That pairing is real, not theoretical —
      # the app image bakes the templates' node_modules and this image ships
      # their sources.
      #
      # Second, the window this opens is harmless. The app probes the
      # library's /health before it will start a generation run
      # (generation-availability.ts), so while the library is being recreated
      # a visitor is told the honest thing — "we will build it by hand and
      # email it to you" — instead of watching a doomed build. The reverse
      # order has no equivalent safety net.
      #
      # Same sudo grant as every other slot script: /opt/flowstarter/staging/*.sh
      # (Cmnd_Alias FLOWSTARTER_SLOTS in /etc/sudoers.d/flowstarter-deploy), so
      # this needs no sudoers change.
      #
      # This step does NOT write /etc/flowstarter/mcp-staging.env. Secrets on
      # this box are placed by hand, once, mode 600; a lane that could rewrite
      # them is a lane that can leak them.
      - name: Deploy the template library over SSH
        if: steps.supabase.outputs.present == 'true' && steps.ssh.outputs.present == 'true'
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          USER: ${{ secrets.STAGING_SSH_USER }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          MCP_IMAGE: ${{ steps.image.outputs.mcp }}:${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/staging_key"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/staging_key"
          SSH=(ssh -i "$RUNNER_TEMP/staging_key" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes)
          # GHCR packages are private; log the host in before docker pull. The
          # app slot's step below does this too — both are needed, because
          # either can be the first to run on a host whose login has expired.
          "${SSH[@]}" "${USER}@${HOST}" \
            "echo $(printf %q "$GHCR_TOKEN") | docker login ghcr.io -u $(printf %q "$GHCR_USERNAME") --password-stdin && sudo /opt/flowstarter/staging/mcp-stack.sh up $(printf %q "$MCP_IMAGE")"

      # `up` already waited for the container to be healthy and ran `check`
      # (loopback publish, authentication actually on, a shared secret that
      # matches the app slot's, the app pointed at this library, the catalog).
      # This is the other half: that /mcp itself refuses an untokened tool
      # call. "The container is running" and "scaffold_template is not serving
      # every template's sources to any caller on this box" are different
      # facts.
      - name: Smoke the template library
        if: steps.supabase.outputs.present == 'true' && steps.ssh.outputs.present == 'true'
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          USER: ${{ secrets.STAGING_SSH_USER }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/staging_key"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/staging_key"
          SSH=(ssh -i "$RUNNER_TEMP/staging_key" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes)
          "${SSH[@]}" "${USER}@${HOST}" "sudo /opt/flowstarter/staging/mcp-stack.sh health"

      - name: Deploy slot main over SSH
        if: steps.supabase.outputs.present == 'true' && steps.ssh.outputs.present == 'true'
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          USER: ${{ secrets.STAGING_SSH_USER }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/staging_key"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/staging_key"
          SSH=(ssh -i "$RUNNER_TEMP/staging_key" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes)
          # GHCR packages are private; log the host in before docker pull.
          "${SSH[@]}" "${USER}@${HOST}" \
            "echo $(printf %q "$GHCR_TOKEN") | docker login ghcr.io -u $(printf %q "$GHCR_USERNAME") --password-stdin && sudo /opt/flowstarter/staging/deploy-slot.sh main $(printf %q "$IMAGE") 3000"

      # The build worker, AFTER the app slot, and the order is the point.
      #
      # The worker's deploy callback posts to flowstarter-main on this box's
      # loopback, and its acceptable-use scan asks the same app for a verdict.
      # Deploying the worker first would give it a window in which it can claim
      # a job off the ledger, build it, and then fail at the publish step
      # against an app slot that is mid-restart — a real client build burnt on
      # a deploy-ordering detail. Deployed second, the worst case is a minute
      # of a job sitting queued, which the worker's own ledger sweep picks up.
      #
      # Same sudo grant as every other slot script: /opt/flowstarter/staging/*.sh
      # (Cmnd_Alias FLOWSTARTER_SLOTS in /etc/sudoers.d/flowstarter-deploy), so
      # this needs no sudoers change. The host is already logged in to ghcr.io
      # from the step above, which is what lets worker-stack.sh pull.
      #
      # This step does NOT write /etc/flowstarter/build-worker-staging.env.
      # Secrets on this box are placed by hand, once, mode 600; a lane that
      # could rewrite them is a lane that can leak them.
      - name: Deploy the build worker over SSH
        if: steps.supabase.outputs.present == 'true' && steps.ssh.outputs.present == 'true'
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          USER: ${{ secrets.STAGING_SSH_USER }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          WORKER_IMAGE: ${{ steps.image.outputs.worker }}:${{ github.sha }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/staging_key"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/staging_key"
          SSH=(ssh -i "$RUNNER_TEMP/staging_key" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes)
          "${SSH[@]}" "${USER}@${HOST}" \
            "sudo /opt/flowstarter/staging/worker-stack.sh up $(printf %q "$WORKER_IMAGE")"

      # `up` already waited for the container to be healthy and ran `check`
      # (loopback bind, a usable shared secret, docker isolation, an identical
      # worktrees path, a reachable daemon). This is the other half: that the
      # worker answers over loopback and that dispatch refuses an unsigned
      # POST. Both matter because "the container is running" and "a paid build
      # will actually be claimed and published" are different facts.
      - name: Smoke the build worker
        if: steps.supabase.outputs.present == 'true' && steps.ssh.outputs.present == 'true'
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          USER: ${{ secrets.STAGING_SSH_USER }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/staging_key"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/staging_key"
          SSH=(ssh -i "$RUNNER_TEMP/staging_key" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes)
          "${SSH[@]}" "${USER}@${HOST}" "sudo /opt/flowstarter/staging/worker-stack.sh health"

      - name: Smoke health URL
        if: steps.supabase.outputs.present == 'true' && steps.ssh.outputs.present == 'true'
        env:
          STAGING_URL: ${{ steps.staging_url.outputs.url }}
        run: |
          set -euo pipefail
          url="${STAGING_URL%/}"
          for i in $(seq 1 30); do
            body="$(curl -fsS "$url/api/health" || true)"
            if printf '%s' "$body" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' &&
              printf '%s' "$body" | grep -Eq '"target"[[:space:]]*:[[:space:]]*"local"'; then
              echo "Healthy and local: $url/api/health"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Staging health check failed at $url/api/health (need both \"ok\":true and \"target\":\"local\")"
          exit 1
