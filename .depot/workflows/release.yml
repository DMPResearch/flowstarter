##############################################################################
# release.yml
#
# One release per week (or on demand).
#
# Cadence
#   Monday 06:00 UTC the lane tags the current main as `release-YYYY-MM-DD`,
#   opens a DRAFT GitHub Release with generated notes, verifies against
#   Hetzner staging, builds the production image for that tag and deploys it
#   to the Hetzner `prod` slot at https://flowstarter.net, verifies production,
#   then publishes the GitHub Release. Between Mondays, `main` updates Hetzner
#   staging only (see staging-deploy.yml).
#
# Where production runs
#   The Hetzner box, slot `prod`, port 3100, container `flowstarter-prod`, env
#   file /etc/flowstarter/prod.env, published by
#   /opt/flowstarter/staging/deploy-slot.sh over the same SSH credentials the
#   staging lanes use. Cloudflare stays proxied in front of flowstarter.net.
#   See deploy/hetzner-staging/README.md and docs/release-process.md.
#
# What blocks a release
#   The draft stays a draft, and this workflow ends red, when either
#   verification job fails:
#     - `staging-journey`  the full-journey tier on staging (when configured).
#                          Waits for the staging slot's /api/health to report
#                          this release's own commit (not just "ok":true) via
#                          .github/scripts/wait-for-staging-slot.sh before
#                          running the journey, since staging-deploy.yml is a
#                          separate, racing workflow and could still be
#                          mid-rollout of this exact commit.
#     - `deploy-prod`      production image build and `prod` slot deploy.
#     - `full-e2e`         verifies the prod slot just deployed (directly, via
#                          curl --resolve, never skipped), then contract +
#                          production synthetic (+ auth journey) against
#                          flowstarter.net — those only once the apex is
#                          actually served by the box rather than Netlify.
#   A job that SKIPS does not block. Missing Clerk credentials and an
#   unconfigured staging URL warn and skip. A job that RUNS and fails always
#   blocks. `deploy-prod` never skips: publishing production is the point of a
#   release, so a missing secret fails it.
#
# Secrets and variables it reads
#   secrets:
#     E2E_CLERK_OPERATOR_EMAIL / E2E_CLERK_OPERATOR_PASSWORD
#     CLERK_SECRET_KEY
#     PROD_NEXT_PUBLIC_SUPABASE_URL       production project, build arg
#     PROD_NEXT_PUBLIC_SUPABASE_ANON_KEY  production anon key, build arg
#     GHCR_TOKEN                          classic PAT with write:packages
#     STAGING_SSH_HOST / _USER / _KEY     the Hetzner box (one host, two slots)
#   vars:
#     PROD_URL                            default https://flowstarter.net
#     STAGING_URL                         https://staging.flowstarter.dev
#     PROD_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
#     NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY   used by the authenticated journey
#     GHCR_USERNAME
#
# Running it by hand
#   depot ci dispatch --repo DMPResearch/flowstarter --workflow release.yml --ref main
#   Pass `tag` to reuse an existing tag instead of cutting a new one.
##############################################################################

name: Release
on:
  release:
    types: [published]
  schedule:
    # Monday 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to release'
        required: false
        default: 'main'
      tag:
        description: 'Tag to use or reuse (default: release-YYYY-MM-DD)'
        required: false
        default: ''
concurrency:
  group: release-depot
  # A release is a sequence of writes to a tag and a release object. Cancelling
  # one halfway leaves a draft nobody owns, so releases queue instead.
  cancel-in-progress: false
env:
  NODE_VERSION: '22'
permissions:
  contents: read
jobs:
  # ── 1. Cut the tag and open the draft ──────────────────────────────────────
  prepare:
    name: Prepare - tag and draft release
    runs-on: depot-ubuntu-latest
    timeout-minutes: 10
    # Writes a tag and a release object.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      release_id: ${{ steps.draft.outputs.release_id }}
      created: ${{ steps.draft.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `release` gives a tag; dispatch and schedule give a branch.
          ref: ${{ github.event.release.tag_name || github.event.inputs.ref || 'main' }}
          fetch-depth: 0
      - name: Resolve the tag
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "release" ]; then
            tag="$RELEASE_TAG"
          elif [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
          else
            tag="release-$(date -u +%Y-%m-%d)"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag}" >> "$GITHUB_STEP_SUMMARY"
      - name: Create the tag and the draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ steps.resolve.outputs.tag }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          created=false

          if [ "$EVENT" = "release" ]; then
            # The human already published it. Nothing to cut.
            echo "Release ${TAG} was published outside this workflow; verifying it."
          else
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              echo "Tag ${TAG} already exists locally; reusing it."
            elif git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "Tag ${TAG} already exists on origin; reusing it."
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" -m "Flowstarter weekly release ${TAG}" "$SHA"
              git push origin "refs/tags/${TAG}"
              echo "Tagged ${SHA} as ${TAG}."
            fi

            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              echo "Release ${TAG} already exists; reusing it."
            else
              gh release create "$TAG" \
                --repo "$REPO" \
                --title "$TAG" \
                --draft \
                --generate-notes
              created=true
            fi
          fi

          # NOT `releases/tags/${TAG}`: that endpoint only resolves PUBLISHED
          # releases. The release this job just opened is a DRAFT, and a draft
          # is not attached to its tag until it is published, so the by-tag
          # lookup answers 404 and `set -e` kills the job — every first release
          # of a tag, which is every release. Listing and matching on
          # `tag_name` sees drafts too.
          release_id=$(gh api "repos/${REPO}/releases" --paginate \
            --jq "[.[] | select(.tag_name==\"${TAG}\")][0].id // empty")
          if [ -z "$release_id" ]; then
            echo "::error::No release found for tag ${TAG}, draft or published."
            exit 1
          fi
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"
          echo "created=${created}" >> "$GITHUB_OUTPUT"

  # ── 2. Full-journey tier on Hetzner staging (tip should already be on main) ─
  staging-journey:
    name: Staging - full journey
    needs: prepare
    runs-on: depot-ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Check the staging URL
        id: staging
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          if [ -n "${STAGING_URL:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "url=${STAGING_URL%/}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::vars.STAGING_URL is not set (expected https://staging.flowstarter.dev). Skipping the full-journey tier; this does not block the release."
            echo "Staging is not configured; the full-journey tier was skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      # Staging deploys on every push to main (staging-deploy.yml), but that
      # is a separate workflow racing this one: this release just tagged
      # "the current main" (needs.prepare.outputs.sha) and there is no
      # guarantee staging has finished rolling that commit out yet, or has
      # even started. Without this wait, the step below could run the release
      # gate's full journey against whatever staging happened to be serving
      # at that instant -- the previous release's build, or a container
      # mid-restart -- and a pass would prove nothing about the commit this
      # release is about to publish. Deliberately NOT continue-on-error, unlike
      # the advisory PR lanes (e2e-smoke.yml, visual-check.yml): staging-journey
      # is one of the two checks release.yml's header names as blocking, so a
      # slot that never reaches this commit inside the budget must fail this
      # job, not skip it quietly and let deploy-prod through unverified.
      - name: Wait for the Hetzner slot to reach this release's commit
        if: steps.staging.outputs.present == 'true'
        run: bash .github/scripts/wait-for-staging-slot.sh
        env:
          TARGET_URL: ${{ steps.staging.outputs.url }}
          TIMEOUT_SECONDS: '900'
          POLL_INTERVAL: '15'
          EXPECT_TARGET: local
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v4
        if: steps.staging.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.staging.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        if: steps.staging.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        if: steps.staging.outputs.present == 'true'
        run: pnpm exec playwright install chromium --with-deps
      - name: E2E - full journey against staging
        if: steps.staging.outputs.present == 'true'
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ steps.staging.outputs.url }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: release-results/staging-journey.json
        run: |
          # A positional argument to `playwright test` is a REGEX matched
          # against the test file path, not a glob. `e2e/**/*.journey.spec.ts`
          # is not a valid regex — `**` is "nothing to repeat" — so this step
          # threw SyntaxError on every run, staging-journey always failed, and
          # deploy-prod (which needs it to succeed) always skipped. The release
          # lane could therefore never publish production at all.
          # The naming convention is unchanged; only the filter is now
          # expressed the way Playwright reads it.
          pnpm exec playwright test "e2e/.*\.journey\.spec\.ts" \
            --project chromium --reporter=list,json --pass-with-no-tests
      - name: Upload Playwright report
        if: always() && steps.staging.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-release-staging-journey
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload the machine-readable results
        if: always() && steps.staging.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-results-staging-journey
          path: release-results/
          retention-days: 30
          if-no-files-found: warn

  # ── 3. Build the release tag and deploy it to the Hetzner `prod` slot ──────
  #
  # Unlike the staging lanes, a missing secret here FAILS rather than warns and
  # skips: a release whose whole purpose is to publish production must not end
  # green having published nothing.
  deploy-prod:
    name: Deploy - Hetzner prod slot from release tag
    needs: [prepare, staging-journey]
    if: always() && needs.prepare.result == 'success' && needs.staging-journey.result == 'success'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      # The production NEXT_PUBLIC_* values are inlined into the client bundle,
      # so a wrong one here ships a production site pointed at the wrong
      # database. Refuse a loopback URL outright: that is a staging value, and
      # a production image built against it would answer "target":"local" and
      # serve nothing anyone can reach.
      - name: Check the production build configuration
        id: prodcfg
        env:
          PROD_SUPABASE_URL: ${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_URL }}
          PROD_SUPABASE_ANON_KEY: ${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PROD_CLERK_PUBLISHABLE_KEY: ${{ vars.PROD_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${PROD_SUPABASE_URL:-}" ] || missing="${missing} PROD_NEXT_PUBLIC_SUPABASE_URL(secret)"
          [ -n "${PROD_SUPABASE_ANON_KEY:-}" ] || missing="${missing} PROD_NEXT_PUBLIC_SUPABASE_ANON_KEY(secret)"
          [ -n "${PROD_CLERK_PUBLISHABLE_KEY:-}" ] || missing="${missing} PROD_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY(var)"
          if [ -n "$missing" ]; then
            echo "::error::Missing production build configuration:${missing}. See docs/ci/secrets.md."
            exit 1
          fi
          host="$(printf '%s' "$PROD_SUPABASE_URL" | sed -E 's#^[a-zA-Z]+://##; s#[/:].*$##')"
          case "$host" in
            127.0.0.1 | localhost | ::1 | host.docker.internal)
              echo "::error::PROD_NEXT_PUBLIC_SUPABASE_URL resolves to '$host'. Production must build against the hosted Supabase project, not a loopback stack."
              exit 1
              ;;
          esac
          echo "url=${PROD_SUPABASE_URL}" >> "$GITHUB_OUTPUT"

      - name: Check the GHCR and SSH credentials
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${GHCR_TOKEN:-}" ] || missing="${missing} GHCR_TOKEN(secret)"
          [ -n "${GHCR_USERNAME:-}" ] || missing="${missing} GHCR_USERNAME(var)"
          [ -n "${HOST:-}" ] || missing="${missing} STAGING_SSH_HOST(secret)"
          [ -n "${SSH_USER:-}" ] || missing="${missing} STAGING_SSH_USER(secret)"
          [ -n "${KEY:-}" ] || missing="${missing} STAGING_SSH_KEY(secret)"
          if [ -n "$missing" ]; then
            echo "::error::Missing credentials for the production deploy:${missing}. See docs/ci/secrets.md."
            exit 1
          fi

      - name: Lowercase image name
        id: image
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/flowstarter-main" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # Must be the account that owns GHCR_TOKEN, not github.actor.
          username: ${{ vars.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `:<tag>` is what a rollback redeploys; `:prod` is a moving pointer at
      # whatever is live, useful for reading the box, never for rolling back.
      # BUILD_LIBRARY_PREVIEWS is true only here: the public /library pages
      # iframe the Astro previews, and production is the only slot that has to
      # serve them.
      - name: Build and push the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/hetzner-staging/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.prepare.outputs.tag }}
            ${{ steps.image.outputs.name }}:prod
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ steps.prodcfg.outputs.url }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.PROD_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SITE_URL=https://flowstarter.net
            BUILD_LIBRARY_PREVIEWS=true
            FLOWSTARTER_BUILD_COMMIT=${{ needs.prepare.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # deploy-slot.sh prod pulls the image, starts `flowstarter-prod` on
      # 127.0.0.1:3100, waits for /api/health to report "env":"production", and
      # only then writes the Caddy snippet for flowstarter.net + www. It runs
      # none of the Supabase CLI stack steps: production talks to the hosted
      # project.
      - name: Deploy slot prod over SSH
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ needs.prepare.outputs.tag }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/prod_key"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/prod_key"
          SSH=(ssh -i "$RUNNER_TEMP/prod_key" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes)
          # GHCR packages are private; log the host in before docker pull.
          "${SSH[@]}" "${SSH_USER}@${HOST}" \
            "echo $(printf %q "$GHCR_TOKEN") | docker login ghcr.io -u $(printf %q "$GHCR_USERNAME") --password-stdin && sudo /opt/flowstarter/staging/deploy-slot.sh prod $(printf %q "$IMAGE") 3100"
          echo "Deployed ${TAG} (${SHA}) to the Hetzner prod slot at https://flowstarter.net." >> "$GITHUB_STEP_SUMMARY"

  # ── 4. Verify production after the prod slot deploy ────────────────────────
  full-e2e:
    name: Full E2E - production and operator journey
    needs: [prepare, deploy-prod]
    if: always() && needs.prepare.result == 'success' && needs.deploy-prod.result == 'success'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
      - name: Resolve the production URL
        id: prod
        env:
          VAR_URL: ${{ vars.PROD_URL }}
        run: |
          set -euo pipefail
          url="${VAR_URL:-https://flowstarter.net}"
          url="${url%/}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Production URL: ${url}" >> "$GITHUB_STEP_SUMMARY"
          host="$(printf '%s' "$url" | sed -E 's#^[a-zA-Z]+://##; s#[/:].*$##')"
          echo "host=${host}" >> "$GITHUB_OUTPUT"

      # ── Verify the slot this run actually deployed ─────────────────────────
      # PROD_URL is a DNS fact; the slot is a fact about this box. Until the
      # apex is cut over they are two different machines, and every check below
      # this point would otherwise pass against whatever the old host still
      # serves while claiming the release was verified. That is exactly what
      # happened with release-2026-09-12: it published green having tested
      # Netlify, not the image it had just deployed.
      #
      # --resolve pins the apex hostname to the box's IP, so Caddy answers on
      # the flowstarter.net vhost by SNI regardless of DNS. -k because that
      # vhost uses `tls internal` until a Cloudflare Origin CA certificate is
      # installed. This step is NOT allowed to skip: it is the only check in
      # this job that is guaranteed to be looking at the release being made.
      - name: Verify the prod slot this release deployed
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          PROD_HOST: ${{ steps.prod.outputs.host }}
        run: |
          set -euo pipefail
          body="$(curl -fsS -k --max-time 20 \
            --resolve "${PROD_HOST}:443:${HOST}" \
            "https://${PROD_HOST}/api/health")"
          echo "Slot /api/health: ${body}"
          if ! printf '%s' "$body" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'; then
            echo "::error::The prod slot on ${HOST} did not report \"ok\":true."
            exit 1
          fi
          if ! printf '%s' "$body" | grep -Eq '"env"[[:space:]]*:[[:space:]]*"production"'; then
            echo "::error::The prod slot on ${HOST} did not report \"env\":\"production\"."
            exit 1
          fi
          echo "Prod slot on ${HOST} verified: \"ok\":true, \"env\":\"production\"." >> "$GITHUB_STEP_SUMMARY"

      # Is PROD_URL the box yet, or still Netlify?
      #
      # NOT by comparing resolved IPs: Cloudflare proxies this zone, so the
      # apex resolves to Cloudflare edge addresses both before and after the
      # cutover and an IP comparison would say "not the box" forever.
      #
      # Netlify stamps `x-nf-request-id` on every response it serves and the
      # box does not, so that header is the discriminator, and it retires
      # itself: the day the apex stops being Netlify the suites below start
      # running again with no edit here. Comparing /api/health bodies would not
      # work — Netlify serves the same app against the same hosted Supabase
      # project, so both sides answer "env":"production" and look identical.
      - name: Is the apex served by this box yet?
        id: apex
        env:
          URL: ${{ steps.prod.outputs.url }}
        run: |
          set -euo pipefail
          headers="$(curl -sSI --max-time 20 "${URL}/" || true)"
          if printf '%s' "$headers" | grep -qi '^x-nf-request-id:'; then
            echo "on_box=false" >> "$GITHUB_OUTPUT"
            msg="${URL} is still served by Netlify (x-nf-request-id present), not the prod slot this release deployed. The production Playwright suites are SKIPPED rather than run against something this release did not build. The slot itself WAS verified directly, in the step above. Cut the apex over to the box to turn these back on."
            echo "::warning::${msg}"
            echo "${msg}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "on_box=true" >> "$GITHUB_OUTPUT"
            echo "${URL} is served by the box; running the production suites against it." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: E2E - keyless contract checks against production
        if: steps.apex.outputs.on_box == 'true'
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ steps.prod.outputs.url }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: release-results/contract.json
          ROUTE_COVERAGE_DIR: route-coverage
        run: |
          pnpm exec playwright test e2e/contract.spec.ts \
            --project chromium --reporter=list,json
      - name: E2E - production synthetic
        if: steps.apex.outputs.on_box == 'true'
        env:
          CI: true
          PROD_SYNTHETIC: '1'
          PLAYWRIGHT_BASE_URL: ${{ steps.prod.outputs.url }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: release-results/prod-synthetic.json
          ROUTE_COVERAGE_DIR: route-coverage
        run: |
          pnpm exec playwright test --project prod-synthetic --reporter=list,json
      - name: Check the operator credentials
        id: clerk
        if: steps.apex.outputs.on_box == 'true'
        env:
          EMAIL: ${{ secrets.E2E_CLERK_OPERATOR_EMAIL }}
          PASSWORD: ${{ secrets.E2E_CLERK_OPERATOR_PASSWORD }}
          CLERK_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          if [ -n "${EMAIL:-}" ] && [ -n "${PASSWORD:-}" ] && \
             [ -n "${CLERK_KEY:-}" ] && [ -n "${CLERK_PUBLISHABLE:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Clerk operator credentials incomplete; skipping the authenticated operator journey. This does not block the release."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: E2E - authenticated operator journey
        if: steps.apex.outputs.on_box == 'true' && steps.clerk.outputs.present == 'true'
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ steps.prod.outputs.url }}
          E2E_CLERK_OPERATOR_EMAIL: ${{ secrets.E2E_CLERK_OPERATOR_EMAIL }}
          E2E_CLERK_OPERATOR_PASSWORD: ${{ secrets.E2E_CLERK_OPERATOR_PASSWORD }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: release-results/authenticated.json
          ROUTE_COVERAGE_DIR: route-coverage
        run: |
          pnpm exec playwright test \
            --project setup --project chromium-auth --reporter=list,json
      - name: E2E route coverage and MVP readiness
        if: always()
        env:
          ROUTE_COVERAGE_DIR: route-coverage
        run: |
          node scripts/e2e-route-coverage.mjs --list-missing || true
          node scripts/mvp-readiness.mjs \
            --playwright-report release-results/contract.json \
            --playwright-report release-results/prod-synthetic.json \
            --playwright-report release-results/authenticated.json \
            --write || true
          {
            if [ -f route-coverage/summary.md ]; then
              cat route-coverage/summary.md
            fi
            echo
            echo "## MVP readiness"
            echo
            echo '```'
            node scripts/mvp-readiness.mjs \
              --playwright-report release-results/contract.json \
              --playwright-report release-results/prod-synthetic.json \
              --playwright-report release-results/authenticated.json || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the readiness scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness
          path: |
            readiness/README.md
            readiness/summary.json
            route-coverage/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-release-full-e2e
          path: playwright-report/
          retention-days: 30
      - name: Upload the machine-readable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-results-full-e2e
          path: release-results/
          retention-days: 30
          if-no-files-found: warn

  # ── 5. Publish, or leave the draft where it is ────────────────────────────
  publish:
    name: Publish - or hold the draft
    needs: [prepare, staging-journey, deploy-prod, full-e2e]
    if: always() && needs.prepare.result == 'success'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Download the full-e2e results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: release-results-full-e2e
          path: results/full-e2e
      - name: Download the staging-journey results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: release-results-staging-journey
          path: results/staging-journey
      - name: Download the readiness scorecard
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: release-readiness
          path: results/readiness
      - name: Decide and write the notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
          FULL_E2E_RESULT: ${{ needs.full-e2e.result }}
          STAGING_RESULT: ${{ needs.staging-journey.result }}
          DEPLOY_PROD_RESULT: ${{ needs.deploy-prod.result }}
          PROD_URL: ${{ vars.PROD_URL }}
          STAGING_URL: ${{ vars.STAGING_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          prod_url="${PROD_URL:-https://flowstarter.net}"

          # A skipped job did not run, so it cannot have found anything. Only a
          # job that ran and failed blocks the release.
          blocked=false
          case "$FULL_E2E_RESULT" in
            success|skipped) ;;
            *) blocked=true ;;
          esac
          case "$STAGING_RESULT" in
            success|skipped) ;;
            *) blocked=true ;;
          esac
          case "$DEPLOY_PROD_RESULT" in
            success|skipped) ;;
            *) blocked=true ;;
          esac

          # Pass counts come from the Playwright JSON reporter, one file per
          # suite. `expected` is the passed count, `unexpected` the failed one.
          suite_line() {
            local label="$1" file="$2" target="$3"
            if [ -f "$file" ]; then
              local passed failed skipped flaky
              passed=$(jq -r '.stats.expected // 0' "$file")
              failed=$(jq -r '.stats.unexpected // 0' "$file")
              skipped=$(jq -r '.stats.skipped // 0' "$file")
              flaky=$(jq -r '.stats.flaky // 0' "$file")
              echo "- ${label} against ${target}: ${passed} passed, ${failed} failed, ${flaky} flaky, ${skipped} skipped"
            else
              echo "- ${label}: did not run"
            fi
          }

          {
            echo
            echo "## Release verification"
            echo
            echo "Verified commit \`${SHA}\` on \`${TAG}\`."
            echo
            suite_line "Keyless contract checks" results/full-e2e/contract.json "${prod_url}"
            suite_line "Production synthetic" results/full-e2e/prod-synthetic.json "${prod_url}"
            suite_line "Authenticated operator journey" results/full-e2e/authenticated.json "${prod_url}"
            suite_line "Staging full journey" results/staging-journey/staging-journey.json "${STAGING_URL:-staging (not configured)}"
            echo
            echo "Job results: deploy-prod ${DEPLOY_PROD_RESULT}, full-e2e ${FULL_E2E_RESULT}, staging-journey ${STAGING_RESULT}."
            echo "Run: ${RUN_URL}"
            echo
            if [ -f results/readiness/readiness/summary.json ]; then
              jq -r '"MVP readiness: \(.score)%, \(.ready) of \(.journeys) journeys proved, \(.money_path.ready) of \(.money_path.total) on the money path."' results/readiness/readiness/summary.json
            else
              echo "MVP readiness: not scored (the scorecard artifact is missing)."
            fi
          } > verification.md

          if [ "$blocked" = "true" ]; then
            {
              echo
              echo "### Not published"
              echo
              echo "This release is held as a draft because a verification job failed."
              echo "Fix the failure, then re-run this workflow with \`tag: ${TAG}\` to re-verify the same commit."
            } >> verification.md
          fi

          gh release view "$TAG" --repo "$REPO" --json body --jq '.body' > body.md || : > body.md
          cat body.md verification.md > notes.md

          if [ "$blocked" = "true" ]; then
            gh release edit "$TAG" --repo "$REPO" --draft --notes-file notes.md
            cat verification.md >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Release held::${TAG} stays a draft: deploy-prod=${DEPLOY_PROD_RESULT}, full-e2e=${FULL_E2E_RESULT}, staging-journey=${STAGING_RESULT}."
            exit 1
          fi

          gh release edit "$TAG" --repo "$REPO" --draft=false --latest --notes-file notes.md
          cat verification.md >> "$GITHUB_STEP_SUMMARY"
          echo "Published ${TAG}."
