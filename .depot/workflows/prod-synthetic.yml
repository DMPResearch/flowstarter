##############################################################################
# prod-synthetic.yml
#
# Tier 4: the production synthetic. It asks one question after every deploy,
# and on a timer in between: is the live site actually serving?
#
# It reads production and writes nothing. No account, no lead, no canary row,
# no deposit. The one POST it makes is an unsigned Stripe webhook, which the
# route has to reject before it touches anything.
#
# This lane is blocking by design. Unlike the advisory preview lanes, a red
# here means the site people pay for is not answering correctly, so the job
# fails loudly instead of warning and going green.
#
# Triggers
#   workflow_dispatch     run it by hand, optionally against another origin
#   schedule              every 6 hours, so a silent outage is found within 6h
#   repository_dispatch   event type `prod-deploy-succeeded`
#
# Production is the Hetzner `prod` slot, published by release.yml on a release
# tag; that lane already runs this synthetic against flowstarter.net in its
# `full-e2e` job, so nothing has to fire the dispatch for an ordinary release.
# The dispatch stays for the out-of-band case: a host agent that redeploys or
# rolls back the slot by hand can announce it with
#
#   gh api repos/DMPResearch/flowstarter/dispatches \
#     -f event_type=prod-deploy-succeeded
#
# optionally with a `client_payload.base_url` to check a different origin.
#
# The base URL is resolved in this order: the dispatch input, then the
# repository_dispatch client_payload, then the PROD_URL repository variable,
# then https://flowstarter.net.
#
# Secrets: none of the checks need one. `GH_REVIEW_TOKEN`, if set, files the
# alert issue under a stable identity, the same optional credential
# daily-qa.yml uses for the same reason; absent, the workflow token does it.
#
# ON FAILURE: same shape as daily-qa.yml's verdict issue, not just the
# `::error` annotation below. One open issue labelled `production-alert` is
# created or updated (never a second one per six-hour run), so the site being
# down is something a human finds without reading Actions history. It is
# closed automatically the next time this lane passes.
##############################################################################

name: Production Synthetic
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Origin to check (no trailing slash)'
        required: false
        default: 'https://flowstarter.net'
  schedule:
    # Every 6 hours, on the hour.
    - cron: '0 */6 * * *'
  repository_dispatch:
    types: [prod-deploy-succeeded]
concurrency:
  group: prod-synthetic-depot
  cancel-in-progress: true
env:
  NODE_VERSION: '22'
# Reads the repository to check it out; on failure it also files or updates
# one issue (see "Open or update the production-alert issue" below).
permissions:
  contents: read
  issues: write
jobs:
  synthetic:
    name: Synthetic - live site
    runs-on: depot-ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
      - name: Resolve the target origin
        id: target
        env:
          DISPATCH_URL: ${{ github.event.inputs.base_url }}
          PAYLOAD_URL: ${{ github.event.client_payload.base_url }}
          VAR_URL: ${{ vars.PROD_URL }}
        run: |
          url="${DISPATCH_URL:-}"
          [ -n "$url" ] || url="${PAYLOAD_URL:-}"
          [ -n "$url" ] || url="${VAR_URL:-}"
          [ -n "$url" ] || url="https://flowstarter.net"
          url="${url%/}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Checking ${url}" >> "$GITHUB_STEP_SUMMARY"
      # No continue-on-error anywhere below: this lane is the alarm, so it has
      # to be able to go red.
      - name: E2E - production synthetic
        run: pnpm exec playwright test --project prod-synthetic
        env:
          CI: true
          PROD_SYNTHETIC: '1'
          PLAYWRIGHT_BASE_URL: ${{ steps.target.outputs.url }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-prod-synthetic
          path: playwright-report/
          retention-days: 30
      - name: Say what broke
        if: failure()
        env:
          TARGET: ${{ steps.target.outputs.url }}
        run: |
          echo "::error title=Production synthetic failed::${TARGET} did not pass the post-deploy checks. Download the playwright-report-prod-synthetic artifact for the failing assertion."
          echo "Production synthetic failed against ${TARGET}." >> "$GITHUB_STEP_SUMMARY"
      # A red check nobody is watching is the exact gap this lane exists to
      # close (see docs/quality/mvp-readiness-2026-09-12.md, "Observability":
      # a production 404 was invisible for hours because the only witness was
      # an annotation on a run nobody opened). One open issue instead, same
      # create-or-update shape as daily-qa.yml's verdict issue: a rerun that
      # is still red updates the existing issue rather than filing a second
      # one beside it.
      - name: Open or update the production-alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_REVIEW_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          TARGET: ${{ steps.target.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          title="Production synthetic failing: ${TARGET}"
          body_file=$(mktemp)
          # shellcheck disable=SC2016  # The backticks below are markdown code
          # spans in the issue body, not command substitution.
          {
            printf '<!-- ai-agent-comment -->\n'
            printf '**AI agent** - production synthetic - not a human reply\n\n'
            printf '<!-- production-synthetic-alert -->\n'
            printf '`%s` did not pass the post-deploy checks at %s (UTC).\n\n' "$TARGET" "$(date -u +"%Y-%m-%d %H:%M")"
            printf -- '- [This run, with the Playwright HTML report, screenshots and traces](%s)\n' "$RUN_URL"
            printf -- '- Artifact `playwright-report-prod-synthetic`\n\n'
            printf 'This issue stays open and is updated, not duplicated, on every failing run until the lane passes again, when it is closed automatically.\n\n'
            printf -- '---\n\n'
            printf 'Filed by `.depot/workflows/prod-synthetic.yml`.\n'
          } > "$body_file"

          if ! gh label create production-alert --repo "$REPO" --color b60205 \
              --description "A production check failed and needs a human" --force >/dev/null 2>&1; then
            echo "::warning title=Production alert labels::could not create or update the 'production-alert' label; filing without it"
          fi

          existing=$(gh issue list --repo "$REPO" --state open --label production-alert \
            --json number,title --jq "[.[] | select(.title == \"${title}\")][0].number" \
            2>/dev/null || true)

          if [ -n "${existing:-}" ] && [ "$existing" != "null" ]; then
            if ! gh issue edit "$existing" --repo "$REPO" --body-file "$body_file" \
                --add-label production-alert >/dev/null 2>&1; then
              gh issue edit "$existing" --repo "$REPO" --body-file "$body_file" >/dev/null
            fi
            gh issue comment "$existing" --repo "$REPO" \
              --body "Still failing as of $(date -u +"%Y-%m-%d %H:%M") UTC. [This run]($RUN_URL)." >/dev/null
            echo "Updated issue #${existing}: ${title}" >> "$GITHUB_STEP_SUMMARY"
          else
            if ! gh issue create --repo "$REPO" --title "$title" --body-file "$body_file" \
                --label production-alert >/dev/null 2>&1; then
              echo "::warning title=Production alert labels::could not file the alert with labels; filing without them"
              gh issue create --repo "$REPO" --title "$title" --body-file "$body_file" >/dev/null
            fi
            echo "Filed a new issue: ${title}" >> "$GITHUB_STEP_SUMMARY"
          fi
      # The other half of "one failure does not spam": once this lane passes
      # again, the alert closes itself instead of sitting open until someone
      # notices by hand.
      - name: Close the production-alert issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_REVIEW_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          TARGET: ${{ steps.target.outputs.url }}
        run: |
          set -u
          existing=$(gh issue list --repo "$REPO" --state open --label production-alert \
            --json number,title --jq "[.[] | select(.title == \"Production synthetic failing: ${TARGET}\")][0].number" \
            2>/dev/null || true)
          if [ -n "${existing:-}" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --repo "$REPO" \
              --body "Recovered: this passed again at $(date -u +"%Y-%m-%d %H:%M") UTC." >/dev/null
            gh issue close "$existing" --repo "$REPO" >/dev/null
            echo "Closed issue #${existing} (recovered)" >> "$GITHUB_STEP_SUMMARY"
          fi
