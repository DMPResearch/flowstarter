##############################################################################
# prod-synthetic.yml
#
# Tier 4: the production synthetic. It asks one question after every deploy,
# and on a timer in between: is the live site actually serving?
#
# It reads production and writes nothing. No account, no lead, no canary row,
# no deposit. The one POST it makes is an unsigned Stripe webhook, which the
# route has to reject before it touches anything.
#
# This lane is blocking by design. Unlike the advisory preview lanes, a red
# here means the site people pay for is not answering correctly, so the job
# fails loudly instead of warning and going green.
#
# Triggers
#   workflow_dispatch     run it by hand, optionally against another origin
#   schedule              every 6 hours, so a silent outage is found within 6h
#   repository_dispatch   event type `prod-deploy-succeeded`
#
# Production is the Hetzner `prod` slot, published by release.yml on a release
# tag; that lane already runs this synthetic against flowstarter.net in its
# `full-e2e` job, so nothing has to fire the dispatch for an ordinary release.
# The dispatch stays for the out-of-band case: a host agent that redeploys or
# rolls back the slot by hand can announce it with
#
#   gh api repos/DMPResearch/flowstarter/dispatches \
#     -f event_type=prod-deploy-succeeded
#
# optionally with a `client_payload.base_url` to check a different origin.
#
# The base URL is resolved in this order: the dispatch input, then the
# repository_dispatch client_payload, then the PROD_URL repository variable,
# then https://flowstarter.net.
#
# Secrets: none. Everything checked here is reachable without a credential,
# which is what makes it safe to run on a schedule.
##############################################################################

name: Production Synthetic
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Origin to check (no trailing slash)'
        required: false
        default: 'https://flowstarter.net'
  schedule:
    # Every 6 hours, on the hour.
    - cron: '0 */6 * * *'
  repository_dispatch:
    types: [prod-deploy-succeeded]
concurrency:
  group: prod-synthetic-depot
  cancel-in-progress: true
env:
  NODE_VERSION: '22'
# Reads the repository to check it out and nothing else. It posts no comment,
# no status and no commit.
permissions:
  contents: read
jobs:
  synthetic:
    name: Synthetic - live site
    runs-on: depot-ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
      - name: Resolve the target origin
        id: target
        env:
          DISPATCH_URL: ${{ github.event.inputs.base_url }}
          PAYLOAD_URL: ${{ github.event.client_payload.base_url }}
          VAR_URL: ${{ vars.PROD_URL }}
        run: |
          url="${DISPATCH_URL:-}"
          [ -n "$url" ] || url="${PAYLOAD_URL:-}"
          [ -n "$url" ] || url="${VAR_URL:-}"
          [ -n "$url" ] || url="https://flowstarter.net"
          url="${url%/}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Checking ${url}" >> "$GITHUB_STEP_SUMMARY"
      # No continue-on-error anywhere below: this lane is the alarm, so it has
      # to be able to go red.
      - name: E2E - production synthetic
        run: pnpm exec playwright test --project prod-synthetic
        env:
          CI: true
          PROD_SYNTHETIC: '1'
          PLAYWRIGHT_BASE_URL: ${{ steps.target.outputs.url }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-prod-synthetic
          path: playwright-report/
          retention-days: 30
      - name: Say what broke
        if: failure()
        env:
          TARGET: ${{ steps.target.outputs.url }}
        run: |
          echo "::error title=Production synthetic failed::${TARGET} did not pass the post-deploy checks. Download the playwright-report-prod-synthetic artifact for the failing assertion."
          echo "Production synthetic failed against ${TARGET}." >> "$GITHUB_STEP_SUMMARY"
