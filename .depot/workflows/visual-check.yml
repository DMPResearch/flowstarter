# Depot CI Migration
# Source: .github/workflows/visual-check.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

##############################################################################
# visual-check.yml
#
# UI visual check: Playwright screenshot comparisons of the key public pages
# (landing, pricing, about, contact, help, login), captured against the
# Hetzner platform slot that serves the PR's head commit, at two viewports
# (visual-desktop 1440x900, visual-mobile iPhone 14), compared against the
# Linux baselines committed under e2e/visual/__screenshots__/linux/.
#
# What each run does:
#   1. Checks whether STAGING_SSH_HOST / STAGING_SSH_USER / STAGING_SSH_KEY are
#      set. Dependabot and fork PRs get no secrets, so the staging PR lane
#      cannot have deployed a slot for them; that is a soft skip (::warning)
#      rather than a red build.
#   2. Resolves the slot URL for the run: a pull request gets
#      https://pr-<n>.staging.flowstarter.dev, a dispatched baseline refresh
#      gets vars.STAGING_URL. It then waits for /api/health to report
#      `"ok":true` and `"target":"local"` via
#      .github/scripts/wait-for-staging-slot.sh (the same script e2e-smoke.yml
#      uses).
#   3. Runs `playwright test --project visual-desktop --project
#      visual-mobile` against that URL.
#   4. If e2e/visual/__screenshots__/linux does not exist yet (first run,
#      nothing committed), runs with --update-snapshots, uploads the result
#      as an artifact, and posts a comment saying baselines still need to be
#      committed. It does NOT push on a normal PR run.
#   5. Posts/updates a single sticky comment on the PR (marker
#      <!-- visual-check -->) summarizing pass/fail per project, the slot
#      URL, and a link to the run's artifacts.
#   6. Always uploads playwright-report/ and test-results/ as the
#      `visual-check-report` artifact (14-day retention).
#
# This lane is advisory when no slot answers, and blocking only on a real
# failure against a slot that did. The wait step runs with continue-on-error
# and a 15-minute budget (TIMEOUT_SECONDS=900, the staging PR lane's own
# build-and-deploy budget); if the slot never becomes healthy in that window
# the job logs a warning, posts a sticky comment saying the check was skipped,
# and ends green instead of red. There are no Netlify Deploy Previews anymore;
# see docs/preview-environment.md.
#
# Baseline refresh procedure (the ONLY sanctioned way to change committed
# baselines):
#   Actions -> "UI Visual Check" -> "Run workflow" -> set update_baselines to
#   true, and set ref to the branch whose baselines you want to refresh
#   (leave ref empty to refresh the branch the workflow is run from). The job
#   re-runs the visual suite with --update-snapshots and, only in this
#   dispatched mode, commits the changed files under
#   e2e/visual/__screenshots__/linux/ as github-actions[bot] and pushes them
#   to that branch. Review the resulting diff/PR before merging like any
#   other change: a baseline refresh should be a deliberate, reviewed act,
#   not something CI does on its own.
#
# Secrets needed:
#   STAGING_SSH_HOST / STAGING_SSH_USER / STAGING_SSH_KEY
#     Not used to connect from here. Their presence is the signal that the
#     staging PR lane could deploy a slot for this commit; absent, there is
#     nothing to screenshot.
#   No other secrets are required; PR comments and the baseline-refresh push
#   both use the workflow's own GITHUB_TOKEN.
# Vars needed:
#   STAGING_URL  default https://staging.flowstarter.dev, used by a dispatched
#                baseline refresh, which has no pull request of its own.
##############################################################################

name: UI Visual Check
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      update_baselines:
        description: 'Commit the refreshed Linux baselines to the target branch'
        type: boolean
        default: false
      ref:
        description: 'Branch to refresh (default: the branch this workflow is dispatched from)'
        type: string
        default: ''
concurrency:
  group: visual-check-depot-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true
env:
  NODE_VERSION: '22'
permissions:
  contents: write
  pull-requests: write
jobs:
  visual:
    name: Visual check
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 30
    if: github.event.pull_request.draft != true
    steps:
      # ── Is there a Hetzner slot to screenshot at all? ──────────────────────
      # Dependabot / fork PRs are handed no secrets, so the staging PR lane
      # cannot have deployed a slot for them. Turn presence into an output here
      # (the `secrets` context isn't readable from a step-level `if`) and gate
      # every remaining step on it, so a missing secret warns and skips instead
      # of failing the build.
      - name: Check the staging SSH secrets
        id: ssh
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          if [ -n "$HOST" ] && [ -n "$SSH_USER" ] && [ -n "$KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::STAGING_SSH_HOST / STAGING_SSH_USER / STAGING_SSH_KEY are not set (expected on dependabot/fork pull requests); no Hetzner slot is deployed for this commit, skipping the visual check."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      # ── Resolve which ref to check out / refresh ───────────────────────────
      # pull_request: always the PR head SHA.
      # workflow_dispatch: `inputs.ref` when given, else the branch the
      # workflow was dispatched from. `branch` is only meaningful for the
      # dispatched-refresh push later; it stays empty on pull_request runs.
      - name: Resolve target ref
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ inputs.ref }}
          DISPATCHED_BRANCH: ${{ github.ref_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            branch="${DISPATCH_REF:-$DISPATCHED_BRANCH}"
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "branch=" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: steps.ssh.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
      - name: Resolve commit SHA
        if: steps.ssh.outputs.present == 'true'
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check whether Linux baselines are committed
        if: steps.ssh.outputs.present == 'true'
        id: baseline
        run: |
          if [ -d e2e/visual/__screenshots__/linux ]; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up pnpm
        if: steps.ssh.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - name: Set up Node
        if: steps.ssh.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        if: steps.ssh.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        if: steps.ssh.outputs.present == 'true'
        run: pnpm exec playwright install chromium --with-deps
      # ── Which slot serves this run ─────────────────────────────────────────
      # A pull request has its own slot at pr-<n>.staging.flowstarter.dev. A
      # dispatched baseline refresh has no pull request, so it screenshots slot
      # `main` at vars.STAGING_URL: baselines are best captured against the
      # same rendering stack the comparisons later run on.
      - name: Resolve the Hetzner slot URL
        id: slot
        if: steps.ssh.outputs.present == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          set -euo pipefail
          url=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              url="https://pr-${PR_NUMBER}.staging.flowstarter.dev"
            fi
          else
            url="${STAGING_URL:-https://staging.flowstarter.dev}"
          fi
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"
      # ── Wait for that slot to be healthy ───────────────────────────────────
      # continue-on-error: a slot that never comes up is an infrastructure
      # signal, not a code defect, so a timeout here must not redden the job.
      # The steps below gate on steps.wait.outputs.url being non-empty instead.
      - name: Wait for the Hetzner slot
        id: wait
        if: steps.ssh.outputs.present == 'true' && steps.slot.outputs.url != ''
        continue-on-error: true
        run: bash .github/scripts/wait-for-staging-slot.sh
        env:
          TARGET_URL: ${{ steps.slot.outputs.url }}
          TIMEOUT_SECONDS: '900'
          POLL_INTERVAL: '15'
          EXPECT_TARGET: local
      - name: No healthy Hetzner slot
        if: steps.ssh.outputs.present == 'true' && steps.wait.outputs.url == ''
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          SLOT_URL: ${{ steps.slot.outputs.url }}
        run: |
          message="${SLOT_URL:-No slot} did not report ok:true with target:local for ${SHA} inside the 15 minute budget. Check the Staging deploy (PR) run for this commit. Skipping."
          echo "::warning::${message}"
          echo "${message}" >> "$GITHUB_STEP_SUMMARY"
      # ── Decide whether this run should write (not just compare) snapshots ──
      # Two cases need --update-snapshots:
      #   - an explicit workflow_dispatch refresh (update_baselines=true) —
      #     the only case that also commits and pushes the result, further
      #     down.
      #   - a normal PR run with no Linux baselines committed yet — we still
      #     want a green, informative run instead of a hard failure on
      #     "snapshot doesn't exist", but we do NOT push; the generated
      #     images are uploaded as an artifact and the sticky comment tells
      #     the reviewer to run the dispatched refresh.
      - name: Determine snapshot mode
        id: mode
        if: steps.ssh.outputs.present == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPDATE_BASELINES: ${{ inputs.update_baselines }}
          BASELINE_MISSING: ${{ steps.baseline.outputs.missing }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$UPDATE_BASELINES" = "true" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "reason=dispatch" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "pull_request" ] && [ "$BASELINE_MISSING" = "true" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "reason=missing" >> "$GITHUB_OUTPUT"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "reason=none" >> "$GITHUB_OUTPUT"
          fi
      # ── Run the visual suite ────────────────────────────────────────────────
      # continue-on-error: a real diff (or a first-run seed) must still reach
      # the artifact-upload and comment steps below with the right pass/fail
      # info, so the job's final conclusion is decided explicitly at the end
      # rather than by letting this step fail the job outright.
      - name: Run visual checks
        id: run_tests
        if: steps.ssh.outputs.present == 'true' && steps.wait.outputs.url != ''
        continue-on-error: true
        env:
          CI: true
          VISUAL_CHECK: '1'
          PLAYWRIGHT_BASE_URL: ${{ steps.wait.outputs.url }}
          UPDATE: ${{ steps.mode.outputs.update }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: visual-results.json
        run: |
          if [ "$UPDATE" = "true" ]; then
            pnpm exec playwright test --config playwright.config.ts \
              --project visual-desktop --project visual-mobile \
              --reporter=list,html,json --update-snapshots
          else
            pnpm exec playwright test --config playwright.config.ts \
              --project visual-desktop --project visual-mobile \
              --reporter=list,html,json
          fi
      - name: Summarize per-project results
        id: summary
        if: always() && steps.ssh.outputs.present == 'true' && steps.wait.outputs.url != ''
        run: |
          summary="see the visual-check-report artifact for per-project results"
          if [ -f visual-results.json ]; then
            parsed=$(jq -r '
              [.suites[]? | .. | objects | select(has("tests")) | .tests[]?] as $tests
              | ($tests | group_by(.projectName)
                  | map(
                      "\(.[0].projectName): "
                      + ([.[] | select(((.results // [{}]) | last | .status) == "passed")] | length | tostring)
                      + "/" + (length | tostring) + " passed"
                    )
                  | join(", "))
            ' visual-results.json 2>/dev/null || true)
            if [ -n "$parsed" ] && [ "$parsed" != "null" ]; then
              summary="$parsed"
            fi
          fi
          {
            echo "summary<<VISUAL_SUMMARY_EOF"
            echo "$summary"
            echo "VISUAL_SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"
      # ── Commit + push refreshed baselines (dispatched refresh only) ────────
      - name: Commit refreshed baselines
        if: steps.mode.outputs.reason == 'dispatch' && steps.ssh.outputs.present == 'true' && steps.wait.outputs.url != ''
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual/__screenshots__/linux
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git commit -m "test(visual): refresh Linux baselines" \
            -m "Co-Authored-By: Claude Fable 5.1 <noreply@anthropic.com>"
          git push origin "HEAD:refs/heads/$BRANCH"
      # ── Artifacts, always ────────────────────────────────────────────────
      - name: Upload visual check artifacts
        if: always() && steps.ssh.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-check-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
      # ── Sticky PR comment ───────────────────────────────────────────────
      - name: Build comment body
        if: always() && github.event_name == 'pull_request'
        env:
          SECRET_PRESENT: ${{ steps.ssh.outputs.present }}
          BASELINE_MISSING: ${{ steps.baseline.outputs.missing }}
          RUN_OUTCOME: ${{ steps.run_tests.outcome }}
          SLOT_URL: ${{ steps.wait.outputs.url }}
          SUMMARY: ${{ steps.summary.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # shellcheck disable=SC2016 # backticks below are literal markdown, not command substitution
          {
            echo '<!-- visual-check -->'
            echo '### UI visual check'
            echo
            if [ "$SECRET_PRESENT" != "true" ]; then
              echo 'Skipped: the `STAGING_SSH_*` secrets are not set for this PR (expected on fork/dependabot pull requests), so no Hetzner slot was deployed for it.'
            elif [ -z "$SLOT_URL" ]; then
              echo 'Skipped: this pull request'"'"'s Hetzner slot did not become healthy within the 15 minute wait budget.'
              echo
              echo 'Check the **Staging deploy (PR)** run for this commit.'
            elif [ "$BASELINE_MISSING" = "true" ]; then
              echo 'No baselines committed yet for these pages; this run generated fresh screenshots and uploaded them as an artifact instead of comparing.'
              echo
              echo 'Run the **UI Visual Check** workflow with `update_baselines=true` (ref = this PR'"'"'s branch) to commit them as the Linux baselines.'
            elif [ "$RUN_OUTCOME" = "success" ]; then
              echo 'All pages matched the Linux baselines.'
            else
              echo 'Visual differences found against the Linux baselines. Download the `visual-check-report` artifact and open `playwright-report/index.html` to see the diffs.'
            fi
            echo
            echo "- Per-project results: ${SUMMARY:-see artifact}"
            echo '- Pages checked: 6 (/, /pricing, /about, /contact, /help, /login)'
            echo "- Slot URL: ${SLOT_URL:-n/a}"
            echo "- Run: ${RUN_URL}"
          } > comment-body.md
      - name: Post or update sticky comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MARKER: '<!-- visual-check -->'
        run: |
          set -euo pipefail
          existing_id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$MARKER\"))][0].id // empty")
          # `gh api -f name=@file` does NOT read the file: -f is --raw-field,
          # which sends the value verbatim, so the comment body arrived as the
          # literal text "@comment-body.md". Build the JSON here instead and
          # feed it on stdin, which also keeps a long body off the argument
          # list.
          if [ -n "$existing_id" ]; then
            jq -n --rawfile body comment-body.md '{body: $body}' \
              | gh api --method PATCH "repos/$REPO/issues/comments/$existing_id" --input -
          else
            jq -n --rawfile body comment-body.md '{body: $body}' \
              | gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" --input -
          fi
      # ── Final conclusion ─────────────────────────────────────────────────
      # A first-run seed (reason=missing) or a dispatched refresh
      # (reason=dispatch) is expected to "fail" the raw playwright invocation
      # in neither case (--update-snapshots always exits 0), so this only
      # trips on a genuine, comparison-mode failure.
      - name: Fail the job on a real visual diff
        if: steps.ssh.outputs.present == 'true' && steps.wait.outputs.url != '' && steps.run_tests.outcome != 'success'
        run: |
          echo "Visual check failed — see the visual-check-report artifact and the sticky PR comment."
          exit 1
