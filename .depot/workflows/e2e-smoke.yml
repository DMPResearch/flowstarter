# Depot CI Migration
# Source: .github/workflows/e2e-smoke.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

##############################################################################
# e2e-smoke.yml
#
# Runs on every PR and push to main / feature branches.
#
# For each commit, the job:
#   1. Resolves the Hetzner platform slot that serves this commit:
#        pull request  → https://pr-<n>.staging.flowstarter.dev
#        push to main  → vars.STAGING_URL (https://staging.flowstarter.dev)
#      and waits for that slot's /api/health to report `"ok":true`,
#      `"target":"local"` AND `"commit":"<this commit's SHA>"`, for up to 15
#      minutes, which is the staging PR lane's own build-and-deploy budget.
#      The commit check matters because a slot takes minutes to redeploy; a
#      health check that only looked at ok/target would pass immediately
#      against the PREVIOUS container while the new one was still building,
#      and this lane would then test stale code under the new commit's name.
#   2. Runs Playwright smoke tests against that URL.
#
# There are no Netlify Deploy Previews anymore. A pull request's preview is its
# Hetzner slot, deployed by .depot/workflows/staging-pr-deploy.yml, and unlike
# a Netlify preview it has a real database behind it (the Supabase CLI stack on
# the host). See docs/preview-environment.md.
#
# What runs: every spec in the `chromium` project, which includes
# `e2e/contract.spec.ts` (tier 1, the keyless contract checks). The run command
# below takes no --project flag, so a new spec file needs no change here;
# confirm with `pnpm exec playwright test --list --project chromium`. The
# production synthetic is deliberately NOT here: it lives in the opt-in
# `prod-synthetic` project and runs from .depot/workflows/prod-synthetic.yml.
#
# This lane is advisory when no slot exists, and blocking only on a real
# failure against a slot that did answer. The wait step runs with
# continue-on-error and a 15-minute budget; if the slot never becomes healthy
# in that window the job logs a warning and ends green instead of red. When the
# `STAGING_SSH_*` secrets are absent (dependabot and fork pull requests get no
# secrets) there is no slot to wait for at all, so the job warns and skips, the
# same convention the staging lanes use.
#
# Secrets:
#   STAGING_SSH_HOST / STAGING_SSH_USER / STAGING_SSH_KEY
#     Not used to connect from here. Their presence is the signal that the
#     staging PR lane could deploy a slot for this commit; absent, there is
#     nothing to smoke.
# Vars:
#   STAGING_URL   default https://staging.flowstarter.dev, used on pushes to main
##############################################################################

name: E2E Smoke — Concierge Flow
on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master]
concurrency:
  group: e2e-smoke-depot-${{ github.ref }}
  cancel-in-progress: true
env:
  NODE_VERSION: '22'
# Every job here only reads the repository: checkout, install, run.
# Nothing writes a comment, a status or a commit, so the token gets
# read-only contents and nothing else.
permissions:
  contents: read
jobs:
  platform-smoke:
    name: Platform Smoke — flowstarter-main routes
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
      # Is there a Hetzner slot to smoke at all?
      #
      # Dependabot and fork pull requests are handed no secrets, so the staging
      # PR lane cannot have deployed a slot for them. The `secrets` context is
      # not readable from a step-level `if`, so presence is turned into an
      # output here and the remaining steps gate on it: a missing secret skips
      # with a warning instead of failing.
      - name: Check the staging SSH secrets
        id: ssh
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          if [ -n "$HOST" ] && [ -n "$SSH_USER" ] && [ -n "$KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::STAGING_SSH_HOST / STAGING_SSH_USER / STAGING_SSH_KEY are not set (expected on dependabot and fork pull requests); no Hetzner slot is deployed for this commit, skipping the platform smoke run."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      # ── Which slot serves this commit ──────────────────────────────────────
      # A pull request has its own slot. A push to main lands on slot `main`.
      # A push to a feature branch has no slot of its own, so there is nothing
      # to smoke and the job says so instead of pointing at somebody else's
      # deployment.
      - name: Resolve the Hetzner slot URL
        id: slot
        if: steps.ssh.outputs.present == 'true'
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          set -euo pipefail
          url=""
          if [ "$EVENT" = "pull_request" ]; then
            if [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              url="https://pr-${PR_NUMBER}.staging.flowstarter.dev"
            fi
          elif [ "$REF_NAME" = "main" ] || [ "$REF_NAME" = "master" ]; then
            url="${STAGING_URL:-https://staging.flowstarter.dev}"
          fi
          if [ -z "$url" ]; then
            message="No Hetzner slot serves ${REF_NAME}; feature-branch pushes get no slot of their own. Skipping the platform smoke run."
            echo "::warning::${message}"
            echo "${message}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"
      # ── Wait for that slot to be healthy AND on this commit ────────────────
      # continue-on-error: a slot that never comes up is an infrastructure
      # signal, not a code defect, so a timeout here must not redden the job.
      # The next steps gate on steps.wait.outputs.url being non-empty instead.
      #
      # EXPECTED_COMMIT closes the race this lane used to lose: deploying a
      # slot takes minutes (build, push, SSH, docker compose up), and the
      # PREVIOUS container answers "ok":true and "target":"local" the whole
      # time the new one is rolling out. Without a commit check this step
      # passed against stale code the instant the old container was found
      # healthy, and the smoke run below then failed assertions this commit
      # was supposed to fix (or passed against a build that never contained
      # it). /api/health now names its own commit; wait until it names this
      # one.
      - name: Wait for the Hetzner slot
        id: wait
        if: steps.ssh.outputs.present == 'true' && steps.slot.outputs.url != ''
        continue-on-error: true
        run: bash .github/scripts/wait-for-staging-slot.sh
        env:
          TARGET_URL: ${{ steps.slot.outputs.url }}
          TIMEOUT_SECONDS: '900'
          POLL_INTERVAL: '15'
          EXPECT_TARGET: local
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: No healthy Hetzner slot
        if: steps.ssh.outputs.present == 'true' && steps.slot.outputs.url != '' && steps.wait.outputs.url == ''
        env:
          SLOT_URL: ${{ steps.slot.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          message="${SLOT_URL} never reported \"ok\":true, \"target\":\"local\" and \"commit\":\"${SHA}\" within 15 minutes. Check the Staging deploy (PR) run for this commit. Skipping."
          echo "::warning::${message}"
          echo "${message}" >> "$GITHUB_STEP_SUMMARY"
      # ── Run smoke against the resolved slot URL ────────────────────────────
      - name: E2E — Platform smoke (landing, auth guards, pricing)
        if: steps.wait.outputs.url != ''
        run: pnpm exec playwright test --config playwright.config.ts
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ steps.wait.outputs.url }}
      # How much of the application the run actually reached.
      #
      # `e2e/support/coverage-fixture.ts` writes one record per test; this
      # merges them against every route under `apps/flowstarter-main/src/app`.
      # No `--min` yet: the number has to be watched for a few weeks before a
      # floor under it means anything, and a lane that goes red on a number
      # nobody has calibrated teaches people to ignore the lane. Add `--min`
      # here once the figure is stable.
      - name: E2E route coverage
        if: always()
        run: |
          node scripts/e2e-route-coverage.mjs --list-missing
          {
            if [ -f test-results/route-coverage/summary.md ]; then
              cat test-results/route-coverage/summary.md
            else
              echo "## E2E route coverage"
              echo
              echo "No per-test records were written, so the Playwright run did not happen."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-platform-smoke
          path: playwright-report/
          retention-days: 14
      - name: Upload the route coverage records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-coverage-platform-smoke
          path: test-results/route-coverage/
          retention-days: 14
          if-no-files-found: warn
