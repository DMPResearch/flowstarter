# Depot CI Migration
# Source: .github/workflows/e2e-smoke.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

##############################################################################
# e2e-smoke.yml
#
# Runs on every PR and push to main / feature branches.
#
# For each commit, the job:
#   1. Polls the Netlify API for a Deploy Preview / branch deploy whose
#      commit_ref matches GITHUB_SHA, waiting until state=ready.
#   2. Runs Playwright smoke tests against that preview URL.
#
# What runs: every spec in the `chromium` project, which since this commit
# includes `e2e/contract.spec.ts` (tier 1, the keyless contract checks). The
# run command below takes no --project flag, so a new spec file needs no
# change here; confirm with `pnpm exec playwright test --list --project
# chromium`. The contract spec needs no Clerk session, no Stripe key and no
# database, which is exactly why it can run against a keyless Deploy Preview.
# The production synthetic is deliberately NOT here: it lives in the opt-in
# `prod-synthetic` project and runs from .depot/workflows/prod-synthetic.yml.
#
# This lane is advisory when no preview exists, and blocking only on a real
# failure against a preview that did resolve. The wait step runs with
# continue-on-error and a 10-minute budget (TIMEOUT_SECONDS=600); if no
# preview shows up in that window the job logs a warning and ends green
# instead of red. As of 2026-09 the Netlify site is linked to the old
# repository address (dmihai91/flowstarter-monorepo) and builds no previews
# for this repository's pull requests. Re-link it under Site settings ->
# Build & deploy -> Continuous deployment to restore full coverage.
#
# Required GitHub Actions secrets:
#   NETLIFY_AUTH_TOKEN  — personal access token (Netlify → User settings →
#                         Applications → Personal access tokens) with read
#                         access to the site.
#   NETLIFY_SITE_ID     — UUID of the site (Netlify → Site settings → General
#                         → API ID).
#
# Optional secrets:
#   E2E_BASE_URL        — fallback URL used only as a last-resort `pages` test
#                         target (not used while NETLIFY_AUTH_TOKEN is set).
##############################################################################

name: E2E Smoke — Concierge Flow
on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master]
concurrency:
  group: e2e-smoke-depot-${{ github.ref }}
  cancel-in-progress: true
env:
  NODE_VERSION: '22'
# Every job here only reads the repository: checkout, install, run.
# Nothing writes a comment, a status or a commit, so the token gets
# read-only contents and nothing else.
permissions:
  contents: read
jobs:
  platform-smoke:
    name: Platform Smoke — flowstarter-main routes
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
      # Is there a Netlify credential at all?
      #
      # Dependabot pull requests are handed no secrets, so the wait script
      # died on its `NETLIFY_AUTH_TOKEN is required` guard and painted every
      # dependency bump red for a reason that had nothing to do with the bump.
      # The `secrets` context is not readable from a step-level `if`, so turn
      # presence into an output here and gate the two Netlify-dependent steps
      # on it. A missing secret now skips with a warning instead of failing.
      - name: Check the Netlify credentials
        id: netlify_creds
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID is not set (expected on dependabot pull requests); skipping the platform smoke run."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      # ── Resolve the Netlify Deploy Preview for this commit ─────────────────
      # continue-on-error: a missing preview is an infrastructure signal, not
      # a code defect, so a timeout here must not redden the job. The next
      # steps gate on steps.netlify.outputs.url being non-empty instead.
      - name: Wait for Netlify Deploy Preview
        id: netlify
        if: steps.netlify_creds.outputs.present == 'true'
        continue-on-error: true
        run: bash .github/scripts/wait-for-netlify-deploy.sh
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          # On pull_request, GITHUB_SHA is the merge ref; the branch tip SHA
          # we need is in pull_request.head.sha.
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TIMEOUT_SECONDS: '600'
          POLL_INTERVAL: '15'
      - name: No Netlify Deploy Preview available
        if: steps.netlify_creds.outputs.present == 'true' && steps.netlify.outputs.url == ''
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          message="No Netlify Deploy Preview for ${SHA}; the Netlify site is linked to the old repository address (dmihai91/flowstarter-monorepo) and must be re-linked to DMPResearch/flowstarter-monorepo under Site settings > Build & deploy > Continuous deployment. Skipping."
          echo "::warning::${message}"
          echo "${message}" >> "$GITHUB_STEP_SUMMARY"
      # ── Run smoke against the resolved Netlify preview URL ─────────────────
      - name: E2E — Platform smoke (landing, auth guards, pricing)
        if: steps.netlify_creds.outputs.present == 'true' && steps.netlify.outputs.url != ''
        run: pnpm exec playwright test --config playwright.config.ts
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ steps.netlify.outputs.url }}
      # How much of the application the run actually reached.
      #
      # `e2e/support/coverage-fixture.ts` writes one record per test; this
      # merges them against every route under `apps/flowstarter-main/src/app`.
      # No `--min` yet: the number has to be watched for a few weeks before a
      # floor under it means anything, and a lane that goes red on a number
      # nobody has calibrated teaches people to ignore the lane. Add `--min`
      # here once the figure is stable.
      - name: E2E route coverage
        if: always()
        run: |
          node scripts/e2e-route-coverage.mjs --list-missing
          {
            if [ -f test-results/route-coverage/summary.md ]; then
              cat test-results/route-coverage/summary.md
            else
              echo "## E2E route coverage"
              echo
              echo "No per-test records were written, so the Playwright run did not happen."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-platform-smoke
          path: playwright-report/
          retention-days: 14
      - name: Upload the route coverage records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-coverage-platform-smoke
          path: test-results/route-coverage/
          retention-days: 14
          if-no-files-found: warn
