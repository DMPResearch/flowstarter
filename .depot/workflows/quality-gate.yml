# Depot CI Migration
# Source: .github/workflows/quality-gate.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

##############################################################################
# quality-gate.yml
#
# Runs on every PR and push to main/feature branches.
# Blocks merge if lint, typecheck, unit tests, or tenant isolation fail.
#
# Steps:
#   1. Lint  — flowstarter-main
#   2. Typecheck — flow-design-system + flowstarter-main
#   3. Unit tests with coverage for flowstarter-main, agentic-codegen and
#      build-worker (vitest), then the coverage ratchet. Each package's vitest
#      config carries a global floor at the level that package has already
#      reached, plus a 90% bar (80% on branches) on every glob that handles
#      money or another tenant's data. Below either and this job is red. The
#      floors themselves live in coverage-floors.json and only ever rise:
#      `node scripts/coverage-ratchet.mjs --update` raises them, nothing
#      lowers them.
#   4. Tenant isolation — real local Supabase stack + verify-rls-local.mjs
##############################################################################

name: Quality Gate
on:
  push:
    branches: [main, master, 'feature/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main, master]
concurrency:
  group: quality-gate-depot-${{ github.ref }}
  cancel-in-progress: true
env:
  NODE_VERSION: '22'
# Every job here only reads the repository: checkout, install, run.
# Nothing writes a comment, a status or a commit, so the token gets
# read-only contents and nothing else.
permissions:
  contents: read
jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint — flowstarter-main
        run: pnpm --dir apps/flowstarter-main lint
        continue-on-error: true
        env:
          ESLINT_USE_FLAT_CONFIG: 'false'
  # ── 2. Typecheck ──────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck — flowstarter-main
        run: pnpm nx run flowstarter-main:typecheck
  # ── 3. Unit tests ─────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests and Coverage
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Each suite runs with --coverage and each vitest config carries
      # thresholds, so a drop below a floor or below the 90% bar on a
      # money-or-data glob ends the step non-zero and the gate goes red. That
      # is the enforcement; the ratchet below is the part that stops the
      # floors from quietly staying where they were set.
      #
      # `continue-on-error` on the first two so one suite's threshold failure
      # does not hide the other two suites' numbers. The `Enforce` step at the
      # bottom is what actually fails the job.
      - name: Unit tests with coverage, flowstarter-main
        id: cov_main
        continue-on-error: true
        run: pnpm --dir apps/flowstarter-main test:coverage
        env:
          # Optional — tests mock Supabase but some imports need the env var defined
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      - name: Unit tests with coverage, agentic-codegen
        id: cov_codegen
        continue-on-error: true
        run: pnpm --dir packages/agentic-codegen test:coverage
      - name: Unit tests with coverage, build-worker
        id: cov_worker
        continue-on-error: true
        run: pnpm --dir apps/build-worker test:coverage
      # The floors in coverage-floors.json only rise. A metric below its floor
      # fails here even when the package's own thresholds passed, which is the
      # case that matters: a suite that was at 84% and is now at 80% still
      # clears a threshold set at 77.
      - name: Coverage ratchet, no metric may fall below its floor
        id: ratchet
        continue-on-error: true
        run: node scripts/coverage-ratchet.mjs
      # The score itself never fails a build -- it is a report, and a report
      # that blocks merges stops being read. What does fail here is the
      # scorecard naming a route pattern that no longer resolves under
      # src/app, which means a route was renamed and readiness/journeys.json
      # was not. That is a stale document, and it is cheap to catch now.
      - name: MVP readiness, and the routes it names still exist
        id: readiness
        continue-on-error: true
        run: node scripts/mvp-readiness.mjs
      - name: Coverage and readiness summary
        if: always()
        run: |
          {
            echo "## Coverage"
            echo
            node scripts/coverage-ratchet.mjs --markdown
            echo
            echo "## MVP readiness (unit signal only)"
            echo
            echo '```'
            node scripts/mvp-readiness.mjs || true
            echo '```'
            echo
            echo "The E2E and production signals need a Playwright report; the release lane scores all three."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summaries
          path: |
            apps/flowstarter-main/coverage/
            packages/agentic-codegen/coverage/
            apps/build-worker/coverage/
            coverage-floors.json
          retention-days: 14
          if-no-files-found: warn
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-flowstarter-main
          path: apps/flowstarter-main/test-results/
          retention-days: 7
      # The step that turns the lane red. It runs after the summary so a
      # failing run still publishes the table that explains it.
      - name: Enforce the coverage gates
        if: always()
        env:
          MAIN: ${{ steps.cov_main.outcome }}
          CODEGEN: ${{ steps.cov_codegen.outcome }}
          WORKER: ${{ steps.cov_worker.outcome }}
          RATCHET: ${{ steps.ratchet.outcome }}
          READINESS: ${{ steps.readiness.outcome }}
        run: |
          set -euo pipefail
          failed=""
          [ "$MAIN" = "success" ] || failed="${failed} flowstarter-main"
          [ "$CODEGEN" = "success" ] || failed="${failed} agentic-codegen"
          [ "$WORKER" = "success" ] || failed="${failed} build-worker"
          [ "$RATCHET" = "success" ] || failed="${failed} coverage-ratchet"
          [ "$READINESS" = "success" ] || failed="${failed} mvp-readiness"
          if [ -n "$failed" ]; then
            echo "::error title=Coverage gate::Failed:${failed}. A money-or-data glob is below 90%, a package is below its floor, a test failed, or readiness/journeys.json names a route that no longer exists. Write the test or fix the document; do not lower the number."
            exit 1
          fi
          echo "Every suite passed its thresholds and every metric is at or above its floor."
  # ── 4. Tenant isolation ───────────────────────────────────────────────────
  # Proves tenant B cannot read tenant A's rows, by direct query (RLS, via a
  # real local Postgres + PostgREST) or via the API (requireWorkspaceAccess in
  # unit-tests, above). This job is the direct-query half; it runs migrations
  # against a throwaway local stack on every run — there is no persistent CI
  # database to accumulate drift against.
  tenant-isolation:
    name: Tenant Isolation
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.95.4
      - name: Start local Supabase stack (applies all migrations)
        # verify-rls-local.mjs talks to Kong (the API gateway on 54321,
        # proxying to PostgREST and to storage-api) and to Postgres. It mints
        # its own HS256 JWTs rather than signing in through GoTrue, and never
        # touches realtime, imgproxy, studio, or the log stack - excluding
        # them here is a real time saving, not a correctness risk.
        # Flag name and the exact exclude list confirmed against
        # `supabase start --help` (CLI 2.95.4):
        #   -x, --exclude strings   [gotrue,realtime,storage-api,imgproxy,
        #     kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,
        #     logflare,vector,supavisor]
        # kong and postgrest are deliberately kept: the script's API_URL is
        # the Kong-fronted REST endpoint. storage-api is kept too, since the
        # proof now covers the private tenant-assets bucket: a member of one
        # workspace must not be able to read or list another workspace's
        # objects, and that policy lives on storage.objects.
        run: |
          supabase start \
            --exclude gotrue,realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      # `supabase status` reports nothing on this runner: the stack is started
      # with most services excluded, and the CLI answers both `-o json` and
      # `-o env` with a "Stopped services" line and no keys. So the script is
      # handed the JWT secret and signs its own anon and service_role tokens,
      # which is all PostgREST verifies. The default below is the Supabase
      # CLI's published local-development secret, the same string every
      # `supabase start` on every machine uses. It is a fixture, not a
      # credential, and it only ever reaches a throwaway stack on 127.0.0.1.
      - name: Verify RLS — tenant B cannot read tenant A's rows
        run: node apps/flowstarter-main/scripts/verify-rls-local.mjs
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_LOCAL_JWT_SECRET || 'super-secret-jwt-token-with-at-least-32-characters-long' }}
      # The verifier proves the tables it knows about. This asks the database
      # which tables carry a tenant key and fails when one of them is not in
      # the verifier's list, so a table added later cannot be unproven and
      # green at the same time. It runs after the verifier deliberately: a
      # failure here is about coverage, and coverage is only interesting once
      # the proof itself has passed.
      - name: Guard - every table with a tenant key is proved
        run: node apps/flowstarter-main/scripts/tenant-table-guard.mjs
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_LOCAL_JWT_SECRET || 'super-secret-jwt-token-with-at-least-32-characters-long' }}
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
