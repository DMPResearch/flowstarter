# Depot CI Migration
# Source: .github/workflows/opencode-review.yml
#
# This lane now runs on Depot only. The GitHub Actions copy under
# .github/workflows/ was retired on 2026-09-09 once the Depot-posted checks
# were confirmed green on a pull request.
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

##############################################################################
# opencode-review.yml
#
# An advisory AI code review of every pull request, run by OpenCode. Runs on
# Depot only (see the migration note above).
#
# ADVISORY, ALWAYS. This job posts a comment and nothing else. It is not in
# any other workflow's `needs`, and its check must never be made required on
# main. A reviewer that can block is a reviewer that blocks the repository
# whenever its model provider has an outage, and that trade is not worth the
# small amount of gatekeeping it would buy. Quality Gate is the blocking lane;
# this one only informs the human who merges.
#
# The `Review` step runs with `continue-on-error: true`, so a model provider
# error (a 429, a timeout, anything short of a completed verdict) never turns
# this check red. It also must not leave the pull request looking reviewed
# by silence: when the step's outcome is not `success`, the "Report a
# missing review verdict" step right after it posts a "no verdict" comment
# naming the model and the reason instead. Re-running the workflow replaces
# that comment with either a real review or a fresh no-verdict comment, so
# stale ones never pile up.
#
# Model, two tiers, same as ereno. Small and medium changes review on GLM 5.2
# and big ones on Kimi K3, both served by the flat-rate Ollama Cloud
# subscription, so neither tier bills per review. Both tiers run the same
# prompt and the same browser harness; only the weights differ.
#
# The tier is decided in this workflow rather than read off a commit status,
# because this repository has no Review Gate to post one. The `Classify this
# pull request` step mirrors ereno's `scripts/classify-pr.mjs` size limits and
# nothing else: more than 8 changed files, or more than 300 changed lines
# (additions plus deletions), makes a change big. ereno's path-risk and
# area-breadth rules are deliberately left out; they encode ereno's directory
# layout, not this one. A classification that cannot be computed falls back to
# the big tier, which is the fail-safe direction. The result is posted on the
# head sha as a `Review classification` commit status with description
# `size=small` or `size=big`, so it is visible on the pull request; that is
# what `statuses: write` below is for.
#
# The provider is read off the model id prefix, so switching providers is a
# variable edit and not a pull request:
#   ollama-cloud/*  needs the secret OLLAMA_API_KEY
#   openrouter/*    needs the secret OPENROUTER_API_KEY
# Anything else resolves to `unsupported` and the job warns and skips.
# `openrouter/*` stays fully supported precisely so a paid provider is one
# variable away: set AI_REVIEW_BIG_MODEL to, for example,
# `openrouter/anthropic/claude-sonnet-5` (that id was checked against the
# OpenRouter models endpoint on 2026-09-09) and the big tier moves over with
# no code change.
#
# Ollama Cloud's flat-rate subscription enforces a session usage limit. A
# large pull request reviewed on the big tier is the likeliest way to hit
# it, and the provider then returns HTTP 429 mid-run; that is one of the
# cases the "no verdict" comment described above exists for. The fallback is
# the `openrouter/*` path above: point `vars.AI_REVIEW_BIG_MODEL` at an
# `openrouter/*` id with `OPENROUTER_API_KEY` set, and the big tier stops
# depending on Ollama Cloud's limit.
#
# Secrets and variables an operator sets:
#   OLLAMA_API_KEY      required while either tier holds an `ollama-cloud/*`
#                       id, which is the default for both
#   OPENROUTER_API_KEY  required when the selected tier holds an
#                       `openrouter/*` id
#   GH_REVIEW_TOKEN     optional. A fine-grained PAT with Issues RW, Pull
#                       requests RW and Contents R. The review comment and the
#                       "eyes" reaction cleanup run under it. Absent, the
#                       workflow token posts instead.
#   STAGING_SSH_HOST / _USER / _KEY  optional. Their presence is what says a
#                       Hetzner slot may exist for this pull request, which
#                       enables the live preview lookup.
#   vars.AI_REVIEW_SMALL_MODEL  optional. Default `ollama-cloud/glm-5.2`.
#   vars.AI_REVIEW_BIG_MODEL    optional. Default `ollama-cloud/kimi-k3`.
#   vars.AI_REVIEW_MODEL        legacy. Read only as a fallback for the big
#                               tier; prefer AI_REVIEW_BIG_MODEL.
#
# Dependabot pull requests get no secrets at all, so the credential check
# finds nothing, warns, and skips every remaining step. That is the intended
# outcome: a dependency bump with no reviewer is fine, a red advisory lane on
# every dependency bump is not.
##############################################################################

name: OpenCode review
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches: [main, master]
concurrency:
  group: opencode-review-depot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  # statuses: write lets the classification step publish `Review
  # classification` on the head sha, so the tier a reviewer ran on is
  # visible on the pull request instead of buried in a job log.
  statuses: write
  # issues: write is not incidental. The action puts an "eyes" reaction on the
  # pull request while it works and removes it afterwards; without this it
  # dies on "Resource not accessible by integration" against
  # /issues/N/reactions.
  issues: write
  pull-requests: write
jobs:
  review:
    name: OpenCode review (advisory)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 30
    steps:
      # Stamped before anything else so the attribution step at the end can
      # tell this run's comments from ones an earlier head left behind.
      - name: Note when this run started
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # Mirrors the size half of ereno's scripts/classify-pr.mjs: BIG_FILE_LIMIT
      # 8, BIG_LINE_LIMIT 300. Its path-risk and area-breadth rules are not
      # copied, because they name ereno's directories. A lookup that fails
      # leaves size=big, which is the fail-safe direction: a small change read
      # by the big model costs nothing anyone notices, a big change read by
      # the small one is a review that missed something.
      - name: Classify this pull request
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BIG_FILE_LIMIT: '8'
          BIG_LINE_LIMIT: '300'
        run: |
          set -u
          size=big
          reason="classification unavailable; defaulting to the big-change reviewer"

          if payload=$(gh pr view "$PR" --repo "$REPO" \
            --json additions,deletions,changedFiles 2>/dev/null); then
            additions=$(printf '%s' "$payload" | jq -r '.additions // 0')
            deletions=$(printf '%s' "$payload" | jq -r '.deletions // 0')
            files=$(printf '%s' "$payload" | jq -r '.changedFiles // 0')
            lines=$(( additions + deletions ))

            reasons=""
            if [ "$files" -gt "$BIG_FILE_LIMIT" ]; then
              reasons="$files files exceed the ${BIG_FILE_LIMIT}-file limit"
            fi
            if [ "$lines" -gt "$BIG_LINE_LIMIT" ]; then
              if [ -n "$reasons" ]; then
                reasons="$reasons; "
              fi
              reasons="${reasons}${lines} changed lines exceed the ${BIG_LINE_LIMIT}-line limit"
            fi

            if [ -n "$reasons" ]; then
              size=big
              reason=$reasons
            else
              size=small
              reason="$files files and $lines changed lines are within the ${BIG_FILE_LIMIT}-file and ${BIG_LINE_LIMIT}-line limits"
            fi
          fi

          echo "Review classification: size=$size ($reason)"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

          # Advisory like the rest of the lane: if the status cannot be
          # posted, say so and carry on reviewing.
          if ! gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=success \
            -f context="Review classification" \
            -f description="size=$size" \
            -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null 2>&1; then
            echo "::warning::Could not post the Review classification commit status."
          fi
      - name: Pick the review model for that tier
        id: pick
        env:
          SIZE: ${{ steps.classify.outputs.size }}
          SMALL_MODEL: ${{ vars.AI_REVIEW_SMALL_MODEL || 'ollama-cloud/glm-5.2' }}
          BIG_MODEL: ${{ vars.AI_REVIEW_BIG_MODEL || vars.AI_REVIEW_MODEL || 'ollama-cloud/kimi-k3' }}
        run: |
          case "$SIZE" in
            small)
              model=$SMALL_MODEL
              echo "Small change: reviewing with $model"
              ;;
            big)
              model=$BIG_MODEL
              echo "Big change: reviewing with $model"
              ;;
            *)
              model=$BIG_MODEL
              echo "No usable classification: using the big-change reviewer $model"
              ;;
          esac

          case "$model" in
            ''|*[!A-Za-z0-9._:/-]*)
              model=unsupported
              provider=unsupported
              ;;
            ollama-cloud/*) provider=ollama-cloud ;;
            openrouter/*) provider=openrouter ;;
            *)
              model=unsupported
              provider=unsupported
              ;;
          esac
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
      # A missing credential is the normal state on a dependabot pull request,
      # which is handed no secrets. Warn and skip; never fail. This lane is
      # advisory, and a red check that only means "no key here" teaches people
      # to ignore red checks.
      - name: Check the selected model credential
        id: creds
        env:
          SELECTED_PROVIDER: ${{ steps.pick.outputs.provider }}
          SELECTED_MODEL: ${{ steps.pick.outputs.model }}
          OLLAMA_API_KEY: ${{ steps.pick.outputs.provider == 'ollama-cloud' && secrets.OLLAMA_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ steps.pick.outputs.provider == 'openrouter' && secrets.OPENROUTER_API_KEY || '' }}
        run: |
          case "$SELECTED_PROVIDER" in
            ollama-cloud)
              key=$OLLAMA_API_KEY
              secret=OLLAMA_API_KEY
              ;;
            openrouter)
              key=$OPENROUTER_API_KEY
              secret=OPENROUTER_API_KEY
              ;;
            *)
              echo "::warning::Unsupported review model provider in ${SELECTED_MODEL}; skipping the review."
              echo "present=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if [ -z "$key" ]; then
            echo "::warning::${secret} is not set (expected on dependabot pull requests); skipping the review."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      # Checked out before the slot lookup below, which runs a script out of
      # this repository. It used to sit after that lookup, so the lookup died
      # on "bash: .github/scripts/wait-for-staging-slot.sh: No such file or
      # directory"; `continue-on-error` hid the exit code and the reviewer was
      # simply told there was no preview, on pull requests where the
      # visual-check lane resolved one from the same secrets.
      - name: Check out the pull request
        if: steps.creds.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # The action runs its own `git fetch` to work out the diff base, so
          # the credentials have to survive the checkout step, and it needs
          # real history rather than a depth-1 cone.
          persist-credentials: true
          fetch-depth: 0
      # The staging PR lane deploys a Hetzner slot per pull request. The
      # `secrets` context is not readable from a step-level `if`, so presence
      # is turned into an output here and gated on below.
      - name: Check the staging SSH secrets
        id: slot_creds
        if: steps.creds.outputs.present == 'true'
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          if [ -n "$HOST" ] && [ -n "$SSH_USER" ] && [ -n "$KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::STAGING_SSH_* are not set (expected on dependabot/fork pull requests); no slot is deployed for this pull request and the reviewer gets no live preview."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      # Reuses the same script the E2E smoke lane uses, on a shorter budget:
      # smoke exists to test the slot and can afford to wait 15 minutes for it,
      # this lane can review the diff without one. `continue-on-error` means a
      # slot that never comes up leaves `url` empty and the review still runs.
      #
      # EXPECTED_COMMIT: without it this step could hand the reviewer a
      # preview still on the PR's PREVIOUS commit, mid-redeploy of this one --
      # /api/health's own commit field is what lets the wait tell those apart.
      - name: Find this pull request's Hetzner slot
        id: preview
        if: steps.slot_creds.outputs.present == 'true'
        continue-on-error: true
        run: bash .github/scripts/wait-for-staging-slot.sh
        env:
          TARGET_URL: https://pr-${{ github.event.pull_request.number }}.staging.flowstarter.dev
          TIMEOUT_SECONDS: '600'
          POLL_INTERVAL: '15'
          EXPECT_TARGET: local
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
      # The lookup runs with `continue-on-error`, so a slot that fails for any
      # reason leaves `url` empty and the reviewer silently loses the browser.
      # Say so out loud instead.
      - name: No Hetzner slot available
        if: steps.slot_creds.outputs.present == 'true' && steps.preview.outputs.url == ''
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LOOKUP_OUTCOME: ${{ steps.preview.outcome }}
        run: |
          echo "::warning::No healthy Hetzner slot for ${HEAD_SHA} (lookup outcome: ${LOOKUP_OUTCOME}); the reviewer reviews the diff without a browser."
      # A URL alone only gives the reviewer curl. Pull a pinned, isolated
      # Chromium environment so the model can exercise the changed flow like a
      # user. The tag tracks @playwright/test in this repository (1.58.2); a
      # mismatch between the container's browsers and the installed client is
      # the usual reason a spec dies on startup. Best effort: a registry
      # outage must not suppress the code review, and no repository or model
      # credential is mounted into the browser container.
      - name: Prepare a real browser for the reviewer
        id: browser
        if: steps.creds.outputs.present == 'true' && steps.preview.outputs.url != ''
        continue-on-error: true
        run: docker pull mcr.microsoft.com/playwright:v1.58.2-noble
      # A reviewer reads; it has no reason to write a commit. But it explores
      # with real git, and some of what it reaches for refuses to run without
      # an identity, which turns an advisory lane red for a reason that has
      # nothing to do with the change. The address is deliberately unroutable
      # (.invalid is reserved by RFC 2606): if a commit ever does appear from
      # this job it should be impossible to mistake for a person's.
      - name: Give the reviewer a git identity
        if: steps.creds.outputs.present == 'true'
        run: |
          git config --global user.email "review@flowstarter.invalid"
          git config --global user.name "Flowstarter review runner"
      - name: Review
        id: review
        if: steps.creds.outputs.present == 'true'
        # Advisory means a provider error is an ordinary outcome, not a
        # reason to turn this check red. The step right after this one
        # covers the gap left when `outcome` is not `success`.
        continue-on-error: true
        # A ceiling BELOW the job's 30, so a hung model is an ordinary step
        # failure with the run still alive around it rather than a job-level
        # kill that takes every remaining step with it.
        timeout-minutes: 25
        uses: anomalyco/opencode/github@3104c1428ec91f809e5ab86631300de41eb6952e # v1.18.30
        env:
          OPENROUTER_API_KEY: ${{ steps.pick.outputs.provider == 'openrouter' && secrets.OPENROUTER_API_KEY || '' }}
          OLLAMA_API_KEY: ${{ steps.pick.outputs.provider == 'ollama-cloud' && secrets.OLLAMA_API_KEY || '' }}
          # Prefer a fine-grained PAT when one exists, so the comment and the
          # reaction cleanup carry a stable identity. Absent, the workflow
          # token still posts the review.
          GITHUB_TOKEN: ${{ secrets.GH_REVIEW_TOKEN || github.token }}
        with:
          # Comment as the workflow's own token rather than exchanging an OIDC
          # token for an OpenCode App installation token: the app is not
          # installed on this org, the exchange fails, and the action then has
          # no API client to post with. Skipping OIDC also means this job
          # needs no id-token: write.
          use_github_token: "true"
          share: "false"
          model: ${{ steps.pick.outputs.model }}
          prompt: |
            Review this pull request against AGENTS.md in the repository root,
            which is the source of truth for the conventions here.

            Report only defects you can point at a line for:
            - correctness bugs, said as what breaks and under what input
            - a tenant isolation leak: a query on a workspace-scoped table
              with no workspace filter, no `withTenant`, and no RLS standing
              behind it
            - a documented fail-open path changed to fail closed
            - user-visible copy that uses em dashes or emojis, or that is
              hard-coded outside `apps/flowstarter-main/src/locales`
            - a rule moved out of deterministic code and into a model prompt
            - a built output patched instead of the generator that produced it
            - a secret printed to logs beyond a short prefix
            - Stripe live mode, or the hosted Supabase project, referenced
              from code or config

            If the change looks correct, say so in one line rather than
            inventing something to report. Do not restate the diff and do not
            suggest stylistic rewrites.

            A Hetzner staging slot for this pull request may be live (blank
            when none is):
            ${{ steps.preview.outputs.url }}
            Browser preparation result: ${{ steps.browser.outcome }}
            When a URL is present it serves the marketing site and the app
            together. Public pages include `/`, `/pricing`, `/about`,
            `/contact`, `/help`, `/login` and `/sign-up`. `/admin/dashboard`
            and `/dashboard` redirect an unauthenticated visitor to sign-in.
            The discovery wizard opens from the landing page. The preview may
            be built without third-party keys, so anything that fails because
            Clerk, Supabase or Stripe is not configured there is a limitation
            to report, not a defect to file against this change.

            When the URL is non-empty, browser preparation succeeded, and the
            diff changes browser-observable user-visible behavior, use the
            pinned Playwright container to test that specific behavior in a
            real Chromium browser. Write one focused temporary spec under
            /tmp/flowstarter-browser-review and run it once, without passing
            any host credentials into the container. The command has a
            two-minute cap; if it fails or times out, do not retry it. Finish
            the code review and report the browser limitation instead.

              timeout 120s docker run --rm \
                -e FLOWSTARTER_PREVIEW_URL='${{ steps.preview.outputs.url }}' \
                -v /tmp/flowstarter-browser-review:/work -w /work \
                mcr.microsoft.com/playwright:v1.58.2-noble bash -lc \
                'npm init -y >/dev/null && npm install --no-save @playwright/test@1.58.2 >/dev/null && npx playwright test review.spec.js --reporter=line'

            Derive the scenario and assertions from the PR title, body and
            diff. Do not use the committed specs under `e2e/` as evidence that
            the changed behavior works. Judge the interaction, rendered state,
            requests and wiring that this PR actually touches. A reproducible
            failure is reportable with the browser steps and the observed
            result.

            End the review with `Browser check:` followed by the exact
            scenario exercised and its result. If the change is
            infrastructure-only or has no browser-observable user-visible
            behavior, there is no live preview, browser preparation failed, or
            the keyless preview cannot reach the effect, state that limitation
            there instead of claiming browser coverage. If the preview stops
            answering during the review, finish from the diff alone and report
            it as unavailable.

            Your reply is posted verbatim as the review comment, under the
            GitHub account that owns the review token, so it must never look
            like a human typed it. Begin with EXACTLY these two lines, then a
            blank line, then the review:

            <!-- ai-agent-comment -->
            **AI agent** · OpenCode (`${{ steps.pick.outputs.model }}`) · on behalf of @dmihai91 · not a human reply

            Write prose after that; never emit tool-call syntax. A raw
            `<invoke ...>` block posted where the verdict belongs makes a pull
            request look reviewed when nothing was read. The trailing
            `Browser check:` line is how automation tells a real verdict from
            that, so it has to be there in every reply.
      # `continue-on-error` on the Review step above keeps this check green
      # through a provider error, but green-and-silent is indistinguishable
      # from reviewed. This step closes that gap: when the Review step did
      # not finish with a verdict, post an explicit "no verdict" comment
      # instead, so the pull request never looks reviewed when it was not.
      - name: Report a missing review verdict
        if: steps.creds.outputs.present == 'true' && steps.review.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_REVIEW_TOKEN || github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_MODEL: ${{ steps.pick.outputs.model }}
          ATTRIB_MARKER: '<!-- ai-agent-comment -->'
          NO_VERDICT_MARKER: '<!-- no-review-verdict -->'
        run: |
          set -u
          MESSAGE="OpenCode produced no verdict (provider error or timeout); the lane is advisory and stays green."
          echo "::warning::${MESSAGE}"
          echo "${MESSAGE}" >> "$GITHUB_STEP_SUMMARY"

          # Delete any earlier no-verdict comment on this pull request first,
          # so reruns replace it instead of piling up beside it.
          # shellcheck disable=SC2016  # jq reads $ENV itself; do not expand here.
          ids=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | contains($ENV.NO_VERDICT_MARKER)) | .id' 2>/dev/null || true)
          for id in $ids; do
            [ -n "$id" ] || continue
            gh api --method DELETE "repos/$REPO/issues/comments/$id" >/dev/null 2>&1 || true
          done

          BANNER="**AI agent** · OpenCode (\`${REVIEW_MODEL}\`) · on behalf of @dmihai91 · not a human reply"
          NOTE="No verdict was produced for head \`${HEAD_SHA}\` because the provider returned an error while running \`${REVIEW_MODEL}\`. Re-running this workflow re-requests the review."
          body=$(printf '%s\n%s\n\n%s\n%s\n' "$ATTRIB_MARKER" "$BANNER" "$NO_VERDICT_MARKER" "$NOTE")
          gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
      # The action posts under GH_REVIEW_TOKEN (today @dmihai91), including
      # raw provider errors like a quota death. The model is told to lead with
      # the AI-agent banner, but an APIError comment never goes through the
      # prompt. Stamp every agent-shaped comment from THIS run that is still
      # missing the marker, so the thread cannot be mistaken for human replies.
      # Runs with `always()` so it still fires when Review failed outright.
      # The no-verdict comment above already carries ATTRIB_MARKER and never
      # matches the "Browser check:|APIError" body test below, so this step
      # leaves it alone rather than stamping it twice.
      - name: Stamp AI-agent attribution on this run's comments
        if: always() && steps.creds.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_REVIEW_TOKEN || github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          STARTED: ${{ steps.started.outputs.at }}
          REVIEW_MODEL: ${{ steps.pick.outputs.model }}
          ATTRIB_MARKER: '<!-- ai-agent-comment -->'
        run: |
          set -u
          ATTRIB_BANNER="**AI agent** · OpenCode (\`${REVIEW_MODEL}\`) · on behalf of @dmihai91 · not a human reply"
          # Only rewrite comments this run produced that already look like the
          # lane (a verdict or a provider error). A human reply posted
          # mid-review must not get a banner glued on.
          # shellcheck disable=SC2016  # jq reads $ENV itself; do not expand here.
          ids=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[]
              | select(.created_at >= $ENV.STARTED)
              | select(.body | test("Browser check:|APIError"))
              | select(.body | contains($ENV.ATTRIB_MARKER) | not)
              | .id
            ' 2>/dev/null || true)
          for id in $ids; do
            [ -n "$id" ] || continue
            body=$(gh api "repos/$REPO/issues/comments/$id" --jq .body)
            stamped=$(printf '%s\n%s\n\n%s\n' "$ATTRIB_MARKER" "$ATTRIB_BANNER" "$body")
            gh api --method PATCH "repos/$REPO/issues/comments/$id" \
              -f body="$stamped" >/dev/null
            echo "Stamped AI-agent attribution on comment $id."
          done
