###############################################################################
# Netlify config for the Flowstarter monorepo
#
# Builds `apps/flowstarter-main` with pnpm, deploys to Netlify with the
# official Next.js Runtime plugin (handles SSR + ISR + middleware).
###############################################################################

[build]
  # Run install + build from the monorepo root so pnpm workspace links resolve.
  # The library previews (5 Astro templates under apps/flowstarter-library/templates/*)
  # are built into apps/flowstarter-main/public/preview/<slug>/ FIRST, so the
  # iframes ship with fresh static output on every deploy. The Astro builds
  # are cheap (≈10s each) and run with `--skip-install` because the workspace
  # install above already pulled their deps via the pnpm-workspace globs.
  base = "."
  command = "pnpm install --frozen-lockfile --prefer-offline && node apps/flowstarter-main/scripts/build-library-previews.mjs --skip-install && pnpm --filter flowstarter build"
  publish = "apps/flowstarter-main/.next"

# Production publishes only from the release workflow (`netlify deploy --prod`
# on a release tag). Automatic git builds for the production context are
# skipped so every merge to main does not burn 15 credits. Deploy Previews
# (context deploy-preview) are unchanged and stay free on credit plans.
[context.production]
  ignore = "exit 0"

[build.environment]
  # Use pnpm, not npm. NETLIFY_USE_PNPM tells Netlify's build image to install
  # dependencies with pnpm at the configured version.
  NETLIFY_USE_PNPM = "true"
  PNPM_FLAGS = "--frozen-lockfile --prefer-offline"
  NEXT_TELEMETRY_DISABLED = "1"
  NX_DAEMON = "true"
  TURBO_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "22"

# Disable Netlify "Pretty URLs" — it 301-redirects /preview/<slug>/index.html
# → /preview/<slug>/, which loops against the Next.js preview rewrite
# (/preview/:slug → /preview/:slug/index.html), causing ERR_TOO_MANY_REDIRECTS
# on the static Astro template previews. The directory index is served directly.
[build.processing.html]
  pretty_urls = false

# --- Runtime / cold-start tuning ---------------------------------------------
# `node_bundler = "esbuild"` produces smaller, faster-cold-starting Lambdas
# than the default zisi bundler (~20–30% smaller bundle in practice).
#
# `region` should match the AWS region your Supabase project lives in so
# the first DB call after a cold start doesn't pay trans-Atlantic latency.
# Look up your project at https://supabase.com/dashboard → Settings →
# General → "Region", then map it to the closest Netlify region:
#   Supabase eu-central-1 (Frankfurt)  →  Netlify eu-central-1
#   Supabase eu-west-1   (Ireland)     →  Netlify eu-west-1
#   Supabase us-east-1   (N. Virginia) →  Netlify us-east-1
#   Supabase us-west-1   (N. California)→ Netlify us-west-2
#   Supabase ap-southeast-1 (Singapore)→  Netlify ap-southeast-1
# Uncomment + set `region` once you've confirmed the Supabase region.
[functions]
  node_bundler = "esbuild"
  # NOTE: function region is NOT a valid netlify.toml property (it fails config
  # validation and breaks the build). To cut cold-start latency, set the region
  # to eu-central-1 (Frankfurt, matching Supabase + EU users) in the Netlify
  # dashboard: Site configuration → Functions → Region.

# Official Next.js Runtime — required for SSR routes, middleware, and ISR.
# It also handles build caching automatically.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Preview templates are static artifacts generated during build. Serve them with
# explicit CDN cache headers to avoid slow revalidation misses on first request.
[[headers]]
  for = "/preview/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, s-maxage=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/showcase/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=2592000, stale-while-revalidate=604800"
