# Platform slots for flowstarter-main on the Hetzner Caddy host: staging
# (`main`, `pr-N`) and production (`prod`).
# Client sites stay under /var/www/sites via deploy-agent, do not mix them.
#
# network_mode: host on purpose. Every staging slot (main and pr-N) talks to
# the Supabase CLI stack that runs directly on the host, bound to loopback
# (http://127.0.0.1:54321 / :54322, see scripts/supabase-stack.sh). Host
# networking is what makes that loopback address the same loopback inside the
# container, with no published port and no bridge hop; the same reasoning
# gives the container a path to the deploy-agents on 127.0.0.1:8443/8444.
# There is no `ports:` section: nothing here is published, staging is reached
# only through Caddy on the host, which proxies to 127.0.0.1:${FLOWSTARTER_HOST_PORT}.
#
# Install once on the box:
#   sudo mkdir -p /opt/flowstarter/staging /etc/flowstarter /etc/caddy/platform
#   sudo cp deploy/hetzner-staging/docker-compose.yml /opt/flowstarter/staging/
#   sudo cp deploy/hetzner-staging/scripts/*.sh /opt/flowstarter/staging/
#   sudo chmod +x /opt/flowstarter/staging/*.sh
#   # Add `import /etc/caddy/platform/*.caddy` to /etc/caddy/Caddyfile
#   sudo touch /etc/flowstarter/staging.env   # secrets; mode 600
#   sudo touch /etc/flowstarter/prod.env      # secrets; mode 600 (prod slot)
#
# CI calls deploy-slot.sh / destroy-slot.sh over SSH. For staging slots
# deploy-slot.sh runs supabase-stack.sh ensure/migrate/write-env before
# `docker compose up`; the prod slot skips every one of those, because it talks
# to the hosted Supabase project rather than the host's local stack.

services:
  # One service definition serves every slot. The name stays `flowstarter-staging`
  # so existing staging projects keep their container identity; what changes per
  # slot is the compose project name, the image, the container name, the port
  # and the env file, all passed in by deploy-slot.sh.
  flowstarter-staging:
    image: ${FLOWSTARTER_IMAGE:-ghcr.io/dmpresearch/flowstarter-main:main}
    container_name: ${FLOWSTARTER_CONTAINER:-flowstarter-staging-main}
    restart: unless-stopped
    network_mode: host
    env_file:
      - ${FLOWSTARTER_ENV_FILE:-/etc/flowstarter/staging.env}
    environment:
      NODE_ENV: production
      PORT: '${FLOWSTARTER_HOST_PORT:-3000}'
      # 0.0.0.0, not 127.0.0.1, and the reason is specific enough to write down.
      #
      # Next 16's server binds HOSTNAME, but its internal proxy hop (the one
      # that exists because this app still has a `middleware.ts`) always dials
      # `localhost`. On this host /etc/hosts maps localhost to BOTH 127.0.0.1
      # and ::1, and Node prefers ::1. So:
      #
      #   HOSTNAME=127.0.0.1  binds v4 only -> proxy dials ::1 -> nothing there
      #                       -> every request dies "socket hang up / ECONNRESET"
      #                       and the slot never passes its health gate.
      #   HOSTNAME=localhost  binds [::1] only -> Caddy's 127.0.0.1 upstream
      #                       cannot reach it.
      #   HOSTNAME=0.0.0.0    binds dual-stack -> both the proxy hop and Caddy
      #                       work. Measured on fs-sites-01, 2026-09-12.
      #
      # What that costs: with `network_mode: host` the slot is a plain listener
      # on every interface, not a published container port, so neither Docker's
      # loopback default publish address nor a DOCKER-USER rule applies to it.
      # The thing that keeps it off the internet is the Hetzner Cloud Firewall
      # (inbound 22/80/443 only), which is the same layer README.md already
      # names as the enforcing one for the Supabase stack. Verify with
      # `nc -z <host> 3000` from somewhere else; it must not connect.
      HOSTNAME: 0.0.0.0
      # FLOWSTARTER_ENV is deliberately NOT set here. It comes from the slot's
      # env file (staging.env carries `FLOWSTARTER_ENV=staging`, prod.env
      # carries `FLOWSTARTER_ENV=production`), because a value under
      # `environment:` wins over `env_file:` and would pin every slot, prod
      # included, to staging. deploy-slot.sh upserts the right line into the
      # env file before it starts the container.
    healthcheck:
      # `$$` escapes the `$` so Compose passes `${process.env.PORT}` through to
      # node instead of trying to interpolate it itself. Unescaped, Compose
      # reads `${process.env.PORT}` as one of its own variables, rejects the
      # dots in the name, and `docker compose up` fails outright with
      # "invalid interpolation format for services.flowstarter-staging.healthcheck.test.[]"
      # before any container starts. deploy-slot.test.sh stubs docker, so no
      # test caught this; the first real deploy did.
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch(`http://127.0.0.1:$${process.env.PORT}/api/health`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
